name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selbsttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Selbsttest headless ausfuehren
        run: node .github/scripts/selbsttest-headless.js
