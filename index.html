/* ---------- Steuerung: Tastatur und Touch ---------- */
const TASTEN = { hoch: false, runter: false, links: false, rechts: false };
let ereignisse = [];   // Einmal-Ereignisse: 'hoch', 'runter', 'enter', 'niederlage'

window.addEventListener('keydown', function (e) {
  audioStart();                       /* Audio erst nach Eingabe (Abschnitt 3) */
  if (SPIEL.zustand === 'kampf') { kampfTastatur(e); return; }
  const k = e.key;
  if (k === 'm' || k === 'M') { tonUmschalten(); return; }
  if (k === 'ArrowUp' || k === 'w' || k === 'W') {
    TASTEN.hoch = true; if (!e.repeat) ereignisse.push('hoch'); e.preventDefault();
  } else if (k === 'ArrowDown' || k === 's' || k === 'S') {
    TASTEN.runter = true; if (!e.repeat) ereignisse.push('runter'); e.preventDefault();
  } else if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
    TASTEN.links = true; if (!e.repeat) ereignisse.push('links'); e.preventDefault();
  } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
    TASTEN.rechts = true; if (!e.repeat) ereignisse.push('rechts'); e.preventDefault();
  } else if (k === 'Enter') {
    if (!e.repeat) ereignisse.push('enter'); e.preventDefault();
  } else if (k === ' ') {
    e.preventDefault();
  }
});
window.addEventListener('keyup', function (e) {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') TASTEN.hoch = false;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') TASTEN.runter = false;
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') TASTEN.links = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') TASTEN.rechts = false;
});
window.addEventListener('blur', function () {
  TASTEN.hoch = TASTEN.runter = TASTEN.links = TASTEN.rechts = false;
});

/* Touch-Steuerkreuz und A-Taste (nur auf Touch-Geräten sichtbar). */
if (IST_TOUCH) document.getElementById('touch').style.display = 'block';
function knopfVerhalten(id, taste, ereignis) {
  const el = document.getElementById(id);
  const an = function (e) {
    e.preventDefault();
    audioStart();                     /* Audio erst nach Eingabe (Abschnitt 3) */
    if (taste) TASTEN[taste] = true;
    if (ereignis) ereignisse.push(ereignis);
  };
  const aus = function (e) {
    e.preventDefault();
    if (taste) TASTEN[taste] = false;
  };
  el.addEventListener('touchstart', an, { passive: false });
  el.addEventListener('touchend', aus, { passive: false });
  el.addEventListener('touchcancel', aus, { passive: false });
  el.addEventListener('mousedown', an);
  el.addEventListener('mouseup', aus);
  el.addEventListener('mouseleave', aus);
}
knopfVerhalten('t-hoch', 'hoch', 'hoch');
knopfVerhalten('t-runter', 'runter', 'runter');
knopfVerhalten('t-links', 'links', 'links');
knopfVerhalten('t-rechts', 'rechts', 'rechts');
knopfVerhalten('t-a', null, 'enter');
document.body.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

/* Antippen des Spielfelds (Kampfschaltflächen, Titelauswahl). */
function spielKoordinaten(e) {
  const r = SPIELLEINWAND.getBoundingClientRect();
  return { x: (e.clientX - r.left) / MASSSTAB, y: (e.clientY - r.top) / MASSSTAB };
}
function verarbeiteTipp(p) {
  if (SPIEL.zustand === 'kampf') {
    kampfTipp(p);
  } else if (SPIEL.zustand === 'welt') {
    /* Ton-Symbol im HUD antippen: Ton an/aus */
    if (p.x >= 196 && p.x < 212 && p.y >= 0 && p.y < 16) tonUmschalten();
  } else if (SPIEL.zustand === 'titel') {
    for (let i = 0; i < TITEL_BEREICHE.length; i++) {
      const r = TITEL_BEREICHE[i];
      if (p.x >= r.x && p.x < r.x + r.b && p.y >= r.y && p.y < r.y + r.h) {
        if (SPIEL.niveauIndex === i) ereignisse.push('enter');
        else SPIEL.niveauIndex = i;
        return;
      }
    }
  } else if (SPIEL.zustand === 'gameover' || SPIEL.zustand === 'ende' || SPIEL.zustand === 'intro') {
    ereignisse.push('enter');
  }
}
SPIELLEINWAND.addEventListener('touchstart', function (e) {
  e.preventDefault();
  audioStart();
  verarbeiteTipp(spielKoordinaten(e.changedTouches[0]));
}, { passive: false });
SPIELLEINWAND.addEventListener('mousedown', function (e) {
  audioStart();
  verarbeiteTipp(spielKoordinaten(e));
});

/* ---------- Welt-Logik ---------- */
function ausgangRechtsMoeglich() {
  const i = SPIELER.bildschirm;
  if (i + 1 >= BILDSCHIRME.length) return false;
  const gebietHier = BILDSCHIRME[i].gebietIndex;
  const gebietDort = BILDSCHIRME[i + 1].gebietIndex;
  /* Zaubertor zwischen zwei Gebieten: erst offen, wenn das Gebiet geschafft ist. */
  if (gebietHier !== gebietDort && !GEBIET_ZUSTAND[gebietHier].besiegt) return false;
  return true;
}

function wechselRechts() {
  SPIEL.wechsel = {
    links: SPIELER.bildschirm, rechts: SPIELER.bildschirm + 1,
    viewStart: 0, viewEnd: 256,
    pxStart: SPIELER.x, pxEnd: 264,
    ziel: SPIELER.bildschirm + 1, zielX: 8,
    schritt: 0
  };
}
function wechselLinks() {
  SPIEL.wechsel = {
    links: SPIELER.bildschirm - 1, rechts: SPIELER.bildschirm,
    viewStart: 256, viewEnd: 0,
    pxStart: 256 + SPIELER.x, pxEnd: 232,
    ziel: SPIELER.bildschirm - 1, zielX: 232,
    schritt: 0
  };
}

function aufsammeln() {
  const bi = SPIELER.bildschirm;
  const b = BILDSCHIRME[bi];
  const gi = b.gebietIndex;
  const z = GEBIET_ZUSTAND[gi], gb = GEBIETE[gi];
  const bx = SPIELER.x + 3, by = SPIELER.y + 8;
  /* Gefallene Herzen */
  for (let i = z.herzFallen.length - 1; i >= 0; i--) {
    const h = z.herzFallen[i];
    if (h.bildschirm !== bi) continue;
    if (bx < h.x + 14 && bx + 10 > h.x + 2 && by < h.y + 15 && by + 7 > h.y + 9) {
      z.herzFallen.splice(i, 1);
      if (SPIELER.herzen < maxHerzen()) {
        SPIELER.herzen++;
        nachricht('Ein Herz zurück!');
      } else {
        nachricht('Deine Herzen sind voll.');
      }
    }
  }
  /* Gegenstand des Gebiets */
  if (gb.gegenstandName && z.gegenstandDraussen && !z.gegenstandMitgenommen
      && gb.gegenstandPos.k === b.karteIndex) {
    const ix = gb.gegenstandPos.x * 16, iy = gb.gegenstandPos.y * 16;
    if (bx < ix + 15 && bx + 10 > ix + 1 && by < iy + 15 && by + 7 > iy + 1) {
      z.gegenstandMitgenommen = true;
      SPIELER.gegenstaende.push(gb.gegenstandName);
      /* Ein Satz zum Gegenstand (Abschnitt 6) */
      nachricht(gb.gegenstandText || ('Du hast das ' + gb.gegenstandName + '!'));
      effekt('gegenstand');
    }
  }
}

/* Boss-Vorraussetzung: alle Gegner besiegt und alle Gegenstände
   eingesammelt (Abschnitt 6). Rückgabe: was noch fehlt. */
function bossBereit() {
  for (let gi = 0; gi < 4; gi++) {
    if (!GEBIET_ZUSTAND[gi].besiegt) {
      return { ok: false, text: 'Es leben noch Monster ' + GEBIETE[gi].textWo + '!' };
    }
  }
  for (let gi = 0; gi < 4; gi++) {
    const gb = GEBIETE[gi];
    if (gb.gegenstandName && !GEBIET_ZUSTAND[gi].gegenstandMitgenommen) {
      return { ok: false, text: 'Das ' + gb.gegenstandName + ' liegt noch ' + gb.textWo + '.' };
    }
  }
  return { ok: true, text: '' };
}

function pruefeKontakt() {
  if (SPIELER.unverwundbar > 0) return;
  const bi = SPIELER.bildschirm;
  const gi = BILDSCHIRME[bi].gebietIndex;
  const z = GEBIET_ZUSTAND[gi];
  for (let i = 0; i < z.monster.length; i++) {
    const m = z.monster[i];
    if (!m.lebt || m.eiszeit > 0 || m.bildschirm !== bi) continue;
    if (SPIELER.x + 3 < m.x + 13 && SPIELER.x + 13 > m.x + 3 &&
        SPIELER.y + 8 < m.y + 15 && SPIELER.y + 15 > m.y + 8) {
      /* Der Boss nimmt den Kampf erst an, wenn alles erledigt und
         gesammelt ist – sonst sagt er, was noch fehlt. */
      if (GEBIETE[gi].boss) {
        const info = bossBereit();
        if (!info.ok) {
          if (!SPIEL.meldungen.length
              || SPIEL.meldungen[SPIEL.meldungen.length - 1].text !== info.text) {
            nachricht(info.text);
          }
          return;
        }
      }
      starteKampf(m, gi);
      return;
    }
  }
}

function tickWelt() {
  const dx = (TASTEN.rechts ? 1 : 0) - (TASTEN.links ? 1 : 0);
  const dy = (TASTEN.runter ? 1 : 0) - (TASTEN.hoch ? 1 : 0);
  if (dx !== 0 || dy !== 0) {
    const t = CONFIG.SPIELER_TEMPO;
    if (platzFrei(SPIELER.bildschirm, SPIELER.x + dx * t, SPIELER.y)) SPIELER.x += dx * t;
    if (platzFrei(SPIELER.bildschirm, SPIELER.x, SPIELER.y + dy * t)) SPIELER.y += dy * t;
    SPIELER.laufTimer++;
    SPIELER.schritt = (SPIELER.laufTimer >> 3) & 1;
    /* Leise Schritte (Etappe 3, Web Audio) */
    if (++SPIELER.schrittTimer >= 14) { SPIELER.schrittTimer = 0; effekt('schritt'); }
    if (dx > 0) SPIELER.blick = 'rechts';
    else if (dx < 0) SPIELER.blick = 'links';
    else if (dy > 0) SPIELER.blick = 'unten';
    else if (dy < 0) SPIELER.blick = 'oben';
  } else {
    SPIELER.laufTimer = 0; SPIELER.schritt = 0;
    SPIELER.schrittTimer = 12;
  }
  /* Bildschirmwechsel am Rand (Abschnitt 4). */
  if (dx > 0 && SPIELER.x >= 240 && ausgangRechtsMoeglich()) wechselRechts();
  else if (dx < 0 && SPIELER.x <= 0 && SPIELER.bildschirm > 0) wechselLinks();

  aktualisiereMonster();
  aufsammeln();
  pruefeKontakt();
}

function tickTitel() {
  for (let i = 0; i < ereignisse.length; i++) {
    const e = ereignisse[i];
    if (e === 'hoch') SPIEL.niveauIndex = (SPIEL.niveauIndex + 2) % 3;
    else if (e === 'runter') SPIEL.niveauIndex = (SPIEL.niveauIndex + 1) % 3;
    else if (e === 'enter') { starteIntro(geschichteSeiten(), neuesSpiel); return; }
  }
}

/* Intro-Zustand: Seiten mit Geschichte und Anleitung, Weiter mit Enter / A / Antippen. */
function tickIntro() {
  for (let i = 0; i < ereignisse.length; i++) {
    if (ereignisse[i] === 'enter') {
      SPIEL.seite++;
      if (SPIEL.seite >= SPIEL.seiten.length) {
        const danach = SPIEL.danach;
        SPIEL.seiten = []; SPIEL.seite = 0; SPIEL.danach = null;
        if (danach) danach();
      }
      return;
    }
  }
}

function tick() {
  SPIEL.frame++;
  if (SPIELER.unverwundbar > 0) SPIELER.unverwundbar--;
  if (SPIELER.blinkDauer > 0) SPIELER.blinkDauer--;
  if (SPIEL.meldungen.length > 0 && --SPIEL.meldungen[0].dauer <= 0) SPIEL.meldungen.shift();
  musikAktualisieren();   /* Titel- und Burg-Melodie je Zustand */

  /* Bildschirmwechsel läuft ab: Welt steht kurz still. */
  if (SPIEL.zustand === 'welt' && SPIEL.wechsel) {
    SPIEL.wechsel.schritt++;
    if (SPIEL.wechsel.schritt >= CONFIG.WECHSEL_DAUER) {
      const altGebiet = BILDSCHIRME[SPIELER.bildschirm].gebietIndex;
      SPIELER.bildschirm = SPIEL.wechsel.ziel;
      SPIELER.x = SPIEL.wechsel.zielX;
      SPIEL.wechsel = null;
      /* Ein Satz beim Betreten eines neuen Gebiets (Abschnitt 6) */
      const neuGebiet = BILDSCHIRME[SPIELER.bildschirm].gebietIndex;
      if (neuGebiet !== altGebiet && !GEBIET_ZUSTAND[neuGebiet].betreten) {
        GEBIET_ZUSTAND[neuGebiet].betreten = true;
        nachricht(GEBIETE[neuGebiet].text);
        /* Erklär-Seite zum neuen Gebiet (Geschichte + Verfahren) */
        starteIntro([GEBIET_SEITEN[neuGebiet]], function () { SPIEL.zustand = 'welt'; });
      }
    }
    ereignisse = [];
    return;
  }

  switch (SPIEL.zustand) {
    case 'titel': tickTitel(); break;
    case 'intro': tickIntro(); break;
    case 'welt': tickWelt(); break;
    case 'kampf':
      tickKampf();
      break;
    case 'gameover':
      if (ereignisse.indexOf('enter') >= 0) starteGebietNeu();
      break;
    case 'ende':
      if (ereignisse.indexOf('enter') >= 0) SPIEL.zustand = 'titel';
      break;
  }
  ereignisse = [];
}

/* ---------- Zeichnen ---------- */
function bildschirmZeichnen(bi, offsetX) {
  const b = BILDSCHIRME[bi];
  const besiegt = GEBIET_ZUSTAND[b.gebietIndex].besiegt;
  for (let ty = 0; ty < CONFIG.FELD_HOEHE; ty++) {
    for (let tx = 0; tx < CONFIG.FELD_BREITE; tx++) {
      let code = b.karte[ty][tx];
      if (code === 'x' && besiegt) code = 'p';   // Zaubertor ist verschwunden
      /* Wände: 8 Varianten (Fackeln bleiben selten), unten keine Fackel */
      let variante = kachelVariante(tx, ty, bi, code === '#' ? 8 : 4);
      if (code === '#' && ty === CONFIG.FELD_HOEHE - 1 && variante === 0) variante = 1;
      KONTEXT.drawImage(
        kachel(b.gebiet.id, code, variante,
          kachelFrame(code, tx, ty), kachelRand(code, b.karte, tx, ty)),
        offsetX + tx * CONFIG.KACHEL,
        CONFIG.HUD_HOEHE + ty * CONFIG.KACHEL);
    }
  }
}

function inhaltZeichnen(bi, offsetX) {
  const g = KONTEXT;
  const b = BILDSCHIRME[bi];
  const gi = b.gebietIndex;
  const gb = GEBIETE[gi];
  const z = GEBIET_ZUSTAND[gi];
  const y0 = CONFIG.HUD_HOEHE;
  /* Gefallene Herzen */
  for (let i = 0; i < z.herzFallen.length; i++) {
    const h = z.herzFallen[i];
    if (h.bildschirm !== bi) continue;
    zeichneSprite(g, HERZ_VOLL, offsetX + h.x + 4,
      y0 + h.y + 4 + (((SPIEL.frame + i * 9) >> 4) & 1));
  }
  /* Gegenstand des Gebiets (erscheint nach dem letzten Monster):
     schwebt 1 px, hat einen Glanzschein und einen wandernden Glanzpunkt */
  if (gb.gegenstandName && z.gegenstandDraussen && !z.gegenstandMitgenommen
      && gb.gegenstandPos.k === b.karteIndex) {
    const p = gb.gegenstandPos;
    const ix = offsetX + p.x * 16 + 4;
    const iy = y0 + p.y * 16 + 3 + (((SPIEL.frame >> 4) & 1));
    dither(g, ix - 2, iy - 2, 12, 12, 'rgba(255,246,207,0.16)');
    zeichneSprite(g, ICONS[gb.gegenstandName], ix, iy);
    const gl = glitzerPixel(ICONS[gb.gegenstandName], SPIEL.frame);
    if (gl) { g.fillStyle = PALETTE[GLANZ]; g.fillRect(ix + gl[0], iy + gl[1], 1, 1); }
  }
  /* Monster: Schattenfleck am Boden, Figur schwebt leicht darüber */
  for (let i = 0; i < z.monster.length; i++) {
    const m = z.monster[i];
    if (!m.lebt || m.bildschirm !== bi) continue;
    schattenZeichnen(g, offsetX + m.x + 8, y0 + m.y + 15, 12);
    zeichneSprite(g, MONSTER_SPRITES[gb.id], offsetX + m.x,
      y0 + m.y + (((SPIEL.frame + i * 13) >> 4) & 1));
  }
}

function miraZeichnen(x, y) {
  /* Schattenfleck unter Mira (bleibt auch beim Blinken sichtbar) */
  schattenZeichnen(KONTEXT, x + 8, CONFIG.HUD_HOEHE + y + 15, 10);
  if (SPIELER.blinkDauer > 0 && ((SPIEL.frame >> 2) & 1) === 0) return;  // Blinken nur nach Herzverlust
  const basis = SPIELER.blick === 'rechts' ? 'links' : SPIELER.blick;
  /* sanfte Idle-Animation: Atmen/Wippen im Stand (2 Frames) */
  const atem = (SPIELER.schritt === 0) ? ((SPIEL.frame >> 5) & 1) : 0;
  zeichneSprite(KONTEXT, MIRA[basis][SPIELER.schritt],
    x, CONFIG.HUD_HOEHE + y + atem, SPIELER.blick === 'rechts');
}

/* HUD-Hintergrund einmal vorrendern: dezenter Verlauf per Dithering,
   Facette (hell oben, dunkel unten) – schont das iPad-Tempo. */
let HUD_CANVAS = null;
function hudHintergrund() {
  if (!HUD_CANVAS) {
    HUD_CANVAS = document.createElement('canvas');
    HUD_CANVAS.width = CONFIG.BREITE; HUD_CANVAS.height = CONFIG.HUD_HOEHE;
    const h = HUD_CANVAS.getContext('2d');
    const F = PALETTE;
    h.fillStyle = F[DUNKELGRAU]; h.fillRect(0, 0, 256, CONFIG.HUD_HOEHE);
    /* Verlauf: oben etwas heller (Dithering in zwei Dichten) */
    dither(h, 0, 0, 256, 2, F[GRAU]);
    h.fillStyle = F[GRAU];
    for (let y = 2; y < 8; y++) {
      for (let x = 0; x < 256; x++) {
        if ((x + y) % 4 === 0) h.fillRect(x, y, 1, 1);
      }
    }
    /* unten dunkler */
    dither(h, 0, 52, 256, 6, F[NACHT]);
    dither(h, 0, 58, 256, 4, F[NACHT]);
    h.fillStyle = F[NACHT]; h.fillRect(0, 62, 256, 2);
    /* Facette: helle Kante ganz oben */
    h.fillStyle = F[HELLGRAU]; h.fillRect(0, 0, 256, 1);
  }
  return HUD_CANVAS;
}

function zeichneHUD(g) {
  const bi = SPIELER.bildschirm;
  const b = BILDSCHIRME[bi];
  g.drawImage(hudHintergrund(), 0, 0);
  /* Herzen mit Glanzpunkt; das letzte Herz pulsiert (1 px Wippen) */
  for (let i = 0; i < maxHerzen(); i++) {
    const voll = i < SPIELER.herzen;
    let hy = 4;
    if (voll && SPIELER.herzen === 1) hy -= ((SPIEL.frame >> 3) & 1);
    g.drawImage(voll ? HERZ_VOLL : HERZ_LEER, 4 + i * 9, hy);
  }
  /* Gebietsname */
  zeichneText(g, b.gebiet.name, 252 - b.gebiet.name.length * 8, 4, GELB);
  /* Niveau und Monster */
  zeichneText(g, 'Niveau: ' + NIVEAUS[SPIEL.niveauIndex], 4, 16, HELLGRAU);
  const z = GEBIET_ZUSTAND[b.gebietIndex];
  const anzahl = z.monster.filter(function (m) { return m.lebt; }).length;
  if (anzahl === 0) {
    zeichneText(g, 'Geschafft!', 252 - 10 * 8, 16, HELLGRUEN);
  } else {
    zeichneText(g, 'Monster: ' + anzahl, 252 - ('Monster: ' + anzahl).length * 8, 16, WEISS);
  }
  /* Vier Fächer für die Gegenstände: Slots mit Innenschatten */
  for (let i = 0; i < 4; i++) {
    const x = 4 + i * 17, y = 28;
    g.fillStyle = PALETTE[NACHT]; g.fillRect(x - 1, y - 1, 15, 15);
    g.fillStyle = PALETTE[SCHWARZ]; g.fillRect(x, y, 13, 13);
    g.fillStyle = PALETTE[NACHT];
    g.fillRect(x, y, 13, 1); g.fillRect(x, y, 1, 13);
    g.fillStyle = PALETTE[GRAU];
    g.fillRect(x, y + 12, 13, 1); g.fillRect(x + 12, y, 1, 13);
    if (GEBIETE[i].gegenstandName && GEBIET_ZUSTAND[i].gegenstandMitgenommen) {
      g.drawImage(ICONS[GEBIETE[i].gegenstandName], x + 2, y + 2);
    }
  }
  /* Minikarte: 9 Bildschirme, aktuelles Gebiet blinkt */
  for (let i = 0; i < BILDSCHIRME.length; i++) {
    const x = 168 + i * 9, y = 28;
    const gi = BILDSCHIRME[i].gebietIndex;
    g.fillStyle = PALETTE[MINI_FARBEN[gi]];
    g.fillRect(x, y, 8, 8);
    if (!GEBIET_ZUSTAND[gi].besiegt) {
      g.fillStyle = 'rgba(0,0,0,0.45)';
      g.fillRect(x, y, 8, 8);
    }
    if (i === bi) {
      g.fillStyle = PALETTE[WEISS];
      g.fillRect(x - 1, y - 1, 10, 1); g.fillRect(x - 1, y + 8, 10, 1);
      g.fillRect(x - 1, y - 1, 1, 10); g.fillRect(x + 8, y - 1, 1, 10);
    }
  }
  /* Rahmen um die Minikarte als Ganzes */
  g.fillStyle = PALETTE[DUNKELGRAU];
  g.fillRect(167, 27, 82, 1); g.fillRect(167, 37, 82, 1);
  g.fillRect(167, 27, 1, 11); g.fillRect(248, 27, 1, 11);
  /* Ton-Symbol: an/aus per M-Taste oder antippen (Etappe 3) */
  g.drawImage(AUDIO.an ? TON_AN : TON_AUS, 200, 4);
  /* Meldung, bei Bedarf zwei Zeilen */
  if (SPIEL.meldungen.length > 0) {
    const zeilen = textUmbruch(SPIEL.meldungen[0].text, 30).slice(0, 2);
    for (let i = 0; i < zeilen.length; i++) {
      zeichneTextMitte(g, zeilen[i], 60 - zeilen.length * 8 + i * 8, GELB);
    }
  }
}

function zeichneWelt() {
  const g = KONTEXT;
  g.fillStyle = PALETTE[SCHWARZ]; g.fillRect(0, 0, 256, 240);
  if (SPIEL.wechsel) {
    const w = SPIEL.wechsel;
    const t = w.schritt / CONFIG.WECHSEL_DAUER;
    const view = Math.round(w.viewStart + (w.viewEnd - w.viewStart) * t);
    bildschirmZeichnen(w.links, -view);
    bildschirmZeichnen(w.rechts, 256 - view);
    inhaltZeichnen(w.links, -view);
    inhaltZeichnen(w.rechts, 256 - view);
    const px = w.pxStart + (w.pxEnd - w.pxStart) * t;
    miraZeichnen(px - view, SPIELER.y);
    /* weicher Übergang: kurzer, dezenter Farbblitz an den Rändern */
    const kante = 1 - t;
    if (kante > 0.1) {
      g.fillStyle = 'rgba(238,240,242,' + (0.28 * kante).toFixed(3) + ')';
      g.fillRect(256 - view - 1, CONFIG.HUD_HOEHE, 2, 176);
      g.fillRect(-view, CONFIG.HUD_HOEHE, 1, 176);
    }
  } else {
    weltOptikPruefen(SPIELER.bildschirm);
    bildschirmZeichnen(SPIELER.bildschirm, 0);
    inhaltZeichnen(SPIELER.bildschirm, 0);
    miraZeichnen(SPIELER.x, SPIELER.y);
    /* Staub beim Laufen (rein optisch, farblich passend zum Gebiet) */
    const bewegt = Math.abs(SPIELER.x - VISUELL.miraX) + Math.abs(SPIELER.y - VISUELL.miraY) > 0.01;
    if (bewegt && SPIEL.frame % 7 === 0) {
      const staub = [SANDMITTE, SANDMITTE, SANDMITTE, HELLGRAU, HELLGRAU]
        [BILDSCHIRME[SPIELER.bildschirm].gebietIndex];
      partikel('welt', SPIELER.x + 8 + zg(-3, 3), CONFIG.HUD_HOEHE + SPIELER.y + 14,
        zg(-2, 2) / 14, -0.2 - Math.random() * 0.2, 12 + zg(0, 6), staub, 'staub');
    }
  }
  VISUELL.miraX = SPIELER.x; VISUELL.miraY = SPIELER.y;
  partikelZeichnen(g, 'welt');
  zeichneHUD(g);
}

/* ---------- Vollbildschirme: Sternenhimmel, Rahmen, Titel-Kontur ----------
   Der Hintergrund (sanfter Pixel-Verlauf per Dithering von MondBlau nach
   Nacht, dazu funkelnde Sterne) wird vorgerendert und langsam
   umgeschaltet. Titeltexte bekommen eine dunkle Kontur und Schatten. */
const HIMMEL_CANVAS = [];
function nachtHimmel(variante) {
  if (!HIMMEL_CANVAS.length) {
    for (let v = 0; v < 2; v++) {
      const c = document.createElement('canvas');
      c.width = CONFIG.BREITE; c.height = CONFIG.HOEHE;
      const h = c.getContext('2d');
      /* Verlauf MONDBLAU → NACHT in Dither-Stufen (Sanfter Pixel-Verlauf) */
      h.fillStyle = PALETTE[MONDBLAU]; h.fillRect(0, 0, 256, 240);
      h.fillStyle = PALETTE[NACHT];
      for (let y = 0; y < 240; y++) {
        const t = y / 240;
        const stufe = t < 0.18 ? 0 : t < 0.42 ? 1 : t < 0.66 ? 2 : t < 0.88 ? 3 : 4;
        if (stufe > 0) {
          for (let x = 0; x < 256; x++) {
            if (((x + y) % 4) < stufe) h.fillRect(x, y, 1, 1);
          }
        }
      }
      /* Sterne: feste Positionen, in Variante B funkeln andere (2 Frames) */
      for (let i = 0; i < 46; i++) {
        const sx = Math.floor(rauschen(i, 1, 77) * 252) + 4;
        const sy = Math.floor(rauschen(i, 2, 77) * 200);
        const hell = rauschen(i, 4, 77);
        const sichtbar = v === 0 ? hell < 0.85 : hell > 0.15;
        if (!sichtbar) continue;
        const r = rauschen(i, 5, 77);
        h.fillStyle = PALETTE[r < 0.3 ? GLANZ : (r < 0.6 ? WEISS : HELLGRAU)];
        h.fillRect(sx, sy, 1, 1);
        if (rauschen(i, 3, 77) > 0.8) {
          h.fillRect(sx - 1, sy, 1, 1); h.fillRect(sx + 1, sy, 1, 1);
          h.fillRect(sx, sy - 1, 1, 1); h.fillRect(sx, sy + 1, 1, 1);
        }
      }
      HIMMEL_CANVAS.push(c);
    }
  }
  return HIMMEL_CANVAS[variante & 1];
}

/* Doppelrahmen im Stil des HUD (hell außen, dunkle Innenlinie). */
function rahmenZeichnen(g) {
  const F = PALETTE;
  g.fillStyle = F[GRAU];
  g.fillRect(2, 2, 252, 1); g.fillRect(2, 237, 252, 1);
  g.fillRect(2, 2, 1, 236); g.fillRect(253, 2, 1, 236);
  g.fillStyle = F[NACHT];

/* ---------- Hauptschleife mit festem Zeittakt ---------- */
let letzteZeit = 0, restZeit = 0;
function schleife(zeit) {
  requestAnimationFrame(schleife);
  if (!letzteZeit) letzteZeit = zeit;
  let delta = zeit - letzteZeit;
  letzteZeit = zeit;
  if (delta > 100) delta = 100;   // Nach Tab-Wechsel nicht aufholen
  restZeit += delta;
  while (restZeit >= CONFIG.FRAME_MS) {
    restZeit -= CONFIG.FRAME_MS;
    tick();
  }
  zeichne();
}
requestAnimationFrame(schleife);

/* ============================================================
   13. Selbsttest – Qualitätssicherung (Abschnitt 12)
   ============================================================
   Aufruf: selbsttest() in der Konsole oder index.html?test
   Prüft: die Referenzaufgaben aus 9.4 mit dem Loeser, je Verfahren
   und Niveau 200 generierte Aufgaben gegen den Loeser (inkl.
   Koeffizientenbereich und trivialer Gleichungen), den
   Eingabe-Parser sowie Karten, Spawns und Schrift aus Etappe 1. */

/* Prüfung einer generierten Aufgabe (Abschnitt 12): Der Loeser
   muss die vom Generator beabsichtigte Lösung liefern, alle
   Koeffizienten bleiben im erlaubten Bereich (Beträge höchstens
   20, außer bei binomischen Formeln), keine Gleichung ist trivial,
   die Anzeige folgt Abschnitt 8. Rückgabe: null oder Fehlertext. */
function pruefeGenerierteAufgabe(auf, verfahren, niveau) {
  const sys = auf.system;
  const l = loeseSystem(sys);
  const soll = auf.loesung;
  if (l.typ !== soll.typ) return 'Loeser sagt ' + l.typ + ', Generator ' + soll.typ;
  if (auf.sfTyp !== soll.typ) return 'sfTyp (' + auf.sfTyp + ') passt nicht zur Lösung (' + soll.typ + ')';
  if (soll.typ === 'eindeutig' && (!l.x.gleich(soll.x) || !l.y.gleich(soll.y))) return 'Lösungswerte weichen ab';
  if (soll.typ === 'unendlich' && (!l.gerade.m.gleich(soll.gerade.m) || !l.gerade.b.gleich(soll.gerade.b))) return 'Gerade weicht ab';
  const texte = [];
  for (let i = 0; i < 2; i++) {
    const g = i === 0 ? sys.g1 : sys.g2;
    if (g.a.istNull() && g.b.istNull()) return 'Gleichung ' + (i + 1) + ' ist trivial';
    const t = glAnzeige(g);
    if (t === '0 = 0') return 'Anzeige „0 = 0"';
    texte.push(t);
    if (g.form.typ === 'binomX') {
      if (Math.abs(g.form.p) > 4 || Math.abs(g.form.q) > 6 || Math.abs(g.form.t) > 20) return 'binomX-Parameter zu groß';
    } else if (g.form.typ === 'binomY') {
      if (Math.abs(g.form.q) > 6 || Math.abs(g.form.v) > 20 || Math.abs(g.form.u) > 20) return 'binomY-Parameter zu groß';
    } else {
      /* Beträge höchstens 20 (außer bei binomischen Formeln, siehe oben);
         bei leicht/standard müssen Koeffizienten als endliche
         Dezimalzahl darstellbar sein (Abschnitt 9.3). */
      const ks = [g.a, g.b, g.c];
      for (let j = 0; j < 3; j++) {
        if (!klein(ks[j], 20)) return 'Koeffizient zu groß: ' + bAnzeigen(ks[j]);
        if (niveau !== 'plus' && !istSchoen(ks[j])) return 'Koeffizient nicht darstellbar: ' + bAnzeigen(ks[j]);
      }
      if (g.form.typ === 'klammer') {
        const f = bAdd(g.c, bGanz(g.form.u * g.form.d));
        if (Math.abs(f.z) > 20) return 'klammer: rechte Seite zu groß';
      }
    }
  }
  if (texte[0] === texte[1]) return 'beide Gleichungen identisch dargestellt';
  const alles = texte.join(' | ');
  if (/(^|[^0-9])1[xy]/.test(alles)) return 'Koeffizient 1 angezeigt: ' + alles;
  if (alles.indexOf('+ −') >= 0) return '„+ −" nicht zusammengefasst: ' + alles;
  if (/(^|[^0-9])0[xy]/.test(alles)) return 'Term mit Faktor 0: ' + alles;
  return null;
}

function selbsttest() {
  const fehler = [];
  const protokoll = [];

  /* 1. Karten: Maße 16 x 11, nur bekannte Kachelcodes */
  const bekannteCodes = ['.', ',', 'f', 'b', 'c', 'p', 'o', '#', '~', 'x'];
  BILDSCHIRME.forEach(function (b, i) {
    if (b.karte.length !== CONFIG.FELD_HOEHE) {
      fehler.push('Bildschirm ' + i + ': ' + b.karte.length + ' Zeilen statt 11');
    }
    b.karte.forEach(function (zeile, y) {
      if (zeile.length !== CONFIG.FELD_BREITE) {
        fehler.push('Bildschirm ' + i + ', Zeile ' + y + ': Länge ' + zeile.length + ' statt 16');
      }
      for (let x = 0; x < zeile.length; x++) {
        if (bekannteCodes.indexOf(zeile[x]) < 0) {
          fehler.push('Bildschirm ' + i + ', Zeile ' + y + ': unbekannter Code "' + zeile[x] + '"');
        }
      }
    });
  });
  protokoll.push({ Pruefung: 'Kartenmaße und Kachelcodes', Ergebnis: 'ok' });

  /* 2. Monster- und Gegenstandspunkte liegen auf begehbarem Boden */
  GEBIETE.forEach(function (gb, gi) {
    gb.monsterSpawns.forEach(function (s) {
      const code = gb.karten[s.k][s.y][s.x];
      if (BLOCKIERT[code]) {
        fehler.push('Gebiet ' + gb.id + ': Spawn (' + s.x + '|' + s.y + ') blockiert ("' + code + '")');
      }
    });
    if (gb.gegenstandPos) {
      const p = gb.gegenstandPos;
      const code = gb.karten[p.k][p.y][p.x];
      if (BLOCKIERT[code]) {
        fehler.push('Gebiet ' + gb.id + ': Gegenstandspunkt blockiert ("' + code + '")');
      }
    }
    /* Startpunkt des Gebiets (Kachel 7|5) muss begehbar sein */
    const start = gb.karten[0][5][7];
    if (BLOCKIERT[start]) {
      fehler.push('Gebiet ' + gb.id + ': Startpunkt blockiert ("' + start + '")');
    }
  });
  protokoll.push({ Pruefung: 'Spawns, Gegenstände, Startpunkte', Ergebnis: 'ok' });

  /* 3. Ausgänge: Zeilen 4-6 an den Rändern */
  BILDSCHIRME.forEach(function (b, i) {
    for (let y = 4; y <= 6; y++) {
      /* Rechter Rand: offen, außer auf dem letzten Bildschirm (Burg) */
      const rechts = b.karte[y][15];
      const rechtsErwartet = (i + 1 < BILDSCHIRME.length);
      if (rechtsErwartet && BLOCKIERT[rechts]) {
        fehler.push('Bildschirm ' + i + ': rechter Ausgang Zeile ' + y + ' blockiert');
      }
      if (!rechtsErwartet && !BLOCKIERT[rechts]) {
        fehler.push('Bildschirm ' + i + ': rechter Rand Zeile ' + y + ' offen, aber kein Nachbar');
      }
      /* Linker Rand: offen, außer auf dem allerersten Bildschirm */
      const links = b.karte[y][0];
      const linksErwartet = (i > 0);
      if (linksErwartet && BLOCKIERT[links]) {
        fehler.push('Bildschirm ' + i + ': linker Ausgang Zeile ' + y + ' blockiert');
      }
      if (!linksErwartet && !BLOCKIERT[links]) {
        fehler.push('Bildschirm ' + i + ': linker Rand Zeile ' + y + ' offen, aber kein Nachbar');
      }
    }
  });
  /* Zaubertore: letzter Bildschirm jedes Gebiets, Spalte 14, Zeilen 4-6 */
  GEBIETE.forEach(function (gb, gi) {
    if (gb.boss) return;
    const karte = gb.karten[gb.karten.length - 1];
    for (let y = 4; y <= 6; y++) {
      if (karte[y][14] !== 'x') {
        fehler.push('Gebiet ' + gb.id + ': Zaubertor fehlt (Zeile ' + y + ')');
      }
    }
  });
  protokoll.push({ Pruefung: 'Ausgänge und Zaubertore', Ergebnis: 'ok' });

  /* 4. Pixelschrift: jedes Zeichen 16 Hex-Zeichen */
  let schriftOk = true;
  Object.keys(SCHRIFT).forEach(function (zeichen) {
    if (!/^[0-9a-fA-F]{16}$/.test(SCHRIFT[zeichen])) {
      fehler.push('Schriftzeichen "' + zeichen + '": ungültige Glyphendaten');
      schriftOk = false;
    }
  });
  /* Wichtige Zeichen vorhanden (Abschnitt 4 und 8) */
  'äöüß−|∧{}(),.·²'.split('').forEach(function (zeichen) {
    if (!SCHRIFT[zeichen]) {
      fehler.push('Schriftzeichen "' + zeichen + '" fehlt');
      schriftOk = false;
    }
  });
  /* Echtes Minus − (U+2212) muss sich deutlich vom Bindestrich - abheben */
  const glyphPixel = function (zeichen) {
    const hex = SCHRIFT[zeichen];
    let n = 0;
    for (let i = 0; i < hex.length; i += 2) {
      const b = parseInt(hex.substr(i, 2), 16);
      for (let bit = 0; bit < 8; bit++) if (b & (0x80 >> bit)) n++;
    }
    return n;
  };
  if (glyphPixel('−') <= glyphPixel('-') + 1) {
    fehler.push('Minuszeichen − ist nicht deutlich breiter als der Bindestrich -');
    schriftOk = false;
  }
  if (schriftOk) protokoll.push({ Pruefung: 'Pixelschrift', Ergebnis: 'ok' });

  /* ---- 5. Referenzaufgaben aus Abschnitt 9.4 (mit dem Loeser) ---- */
  const refA = {
    name: '2y = −2x + 3 ∧ x = 4y',
    sys: {
      g1: glNormalform(bGanz(2), bGanz(2), bGanz(3), { typ: 'gemischt', x: 'R', y: 'L', c: 'R', ordnung: 'xy' }),
      g2: glNormalform(bGanz(1), bGanz(-4), bGanz(0), { typ: 'aufg', vari: 'x', reihenfolge: 'xb' })
    },
    erwartet: 'L = {(1,2|0,3)}',
    anzeige: ['2y = −2x + 3', 'x = 4y']
  };
  const refB = {
    name: '2y − 8x = −14 ∧ 12x − 21 = 3y',
    sys: {
      g1: glNormalform(bGanz(-8), bGanz(2), bGanz(-14), { typ: 'gemischt', x: 'L', y: 'L', c: 'R', ordnung: 'yx' }),
      g2: glNormalform(bGanz(12), bGanz(-3), bGanz(21), { typ: 'gemischt', x: 'L', y: 'R', c: 'L', ordnung: 'xy' })
    },
    erwartet: 'L = {(x|y) | y = 4x − 7}',
    anzeige: ['2y − 8x = −14', '12x − 21 = 3y']
  };
  const refC = {
    name: 'y + x = 8 ∧ 14x + 14y = 28',
    sys: {
      g1: glNormalform(bGanz(1), bGanz(1), bGanz(8), { typ: 'normal', ordnung: 'yx' }),
      g2: glNormalform(bGanz(14), bGanz(14), bGanz(28), { typ: 'normal', ordnung: 'xy' })
    },
    erwartet: 'L = { }',
    anzeige: ['y + x = 8', '14x + 14y = 28']
  };
  const refD = {
    name: '(3x − 2)² = 9x² − 4y ∧ (y − 1)² + 2x = y · y',
    sys: {
      g1: glNormalform(bGanz(-12), bGanz(4), bGanz(-4), { typ: 'binomX', p: 3, q: -2, s: -4, t: 0 }),
      g2: glNormalform(bGanz(2), bGanz(-2), bGanz(-1), { typ: 'binomY', q: -1, u: 2, v: 0 })
    },
    erwartet: 'L = {(0,75|1,25)}',
    anzeige: ['(3x − 2)² = 9x² − 4y', '(y − 1)² + 2x = y · y']
  };
  [refA, refB, refC, refD].forEach(function (r) {
    const l = loeseSystem(r.sys);
    const a = loesungsmengeAnzeige(l);
    if (a !== r.erwartet) fehler.push('Referenz „' + r.name + '": ' + a + ' statt ' + r.erwartet);
    if (glAnzeige(r.sys.g1) !== r.anzeige[0]) {
      fehler.push('Referenz „' + r.name + '": Anzeige „' + glAnzeige(r.sys.g1) + '" statt „' + r.anzeige[0] + '"');
    }
    if (glAnzeige(r.sys.g2) !== r.anzeige[1]) {
      fehler.push('Referenz „' + r.name + '": Anzeige „' + glAnzeige(r.sys.g2) + '" statt „' + r.anzeige[1] + '"');
    }
    const weg = erzeugeWeg(r.sys, 'addition', l);
    if (!weg || weg.length < 3) fehler.push('Referenz „' + r.name + '": leerer Lösungsweg');
  });
  protokoll.push({ Pruefung: 'Referenzaufgaben 9.4', Ergebnis: 'ok' });

  /* ---- 6. je Verfahren und Niveau 200 generierte Aufgaben ---- */
  VERFAHREN_LISTE.forEach(function (v) {
    NIVEAUS.forEach(function (n) {
      let ok = 0;
      for (let i = 0; i < 200; i++) {
        const auf = erzeugeAufgabe(v, n, 'auto');
        let meldung = pruefeGenerierteAufgabe(auf, v, n);
        /* Lösungsweg darf nirgends durch 0 teilen */
        const vorher = BRUCH_NULLNENNER;
        erzeugeWeg(auf.system, v, auf.loesung);
        if (!meldung && BRUCH_NULLNENNER !== vorher) {
          meldung = 'Lösungsweg teilt durch 0: ' + glAnzeige(auf.system.g1) + ' ∧ ' + glAnzeige(auf.system.g2);
        }
        if (meldung) fehler.push(v + '/' + n + ' Nr. ' + i + ': ' + meldung);
        else ok++;
      }
      protokoll.push({ Pruefung: v + ' · ' + n + ' (200 Aufgaben)', Ergebnis: ok + ' von 200 ok' });
    });
  });
  /* Stichproben: Lösungsweg je Verfahren und Sonderfall */
  VERFAHREN_LISTE.forEach(function (v) {
    ['eindeutig', 'keine', 'unendlich'].forEach(function (sf) {
      for (let i = 0; i < 5; i++) {
        const auf = erzeugeAufgabe(v, 'standard', sf);
        const weg = erzeugeWeg(auf.system, v, auf.loesung);
        if (!weg || weg.length < 3) fehler.push('Lösungsweg ' + v + '/' + sf + ' zu kurz');
        for (let j = 0; j < weg.length; j++) {
          if (weg[j].length > 30) fehler.push('Lösungsweg ' + v + '/' + sf + ': Zeile zu lang: ' + weg[j]);
        }
      }
    });
  });
  protokoll.push({ Pruefung: 'Lösungswege (Stichproben)', Ergebnis: 'ok' });

  /* ---- 7. Eingabe-Parser (Abschnitt 12) ---- */
  const parserFaelle = [
    ['0,75', [3, 4]], ['0.75', [3, 4]], ['3/4', [3, 4]], ['-3/4', [-3, 4]], ['−3/4', [-3, 4]],
    [' 3 / 4 ', [3, 4]], ['2', [2, 1]], ['1,5', [3, 2]], ['0,3', [3, 10]], ['-2', [-2, 1]],
    ['abc', null], ['1/0', null], ['1/2/3', null], ['', null], ['1,2,3', null],
    ['--1', null], ['1..2', null], ['3/', null], ['/,5', null]
  ];
  let parserOk = 0;
  parserFaelle.forEach(function (f) {
    const erg = parseEingabe(f[0]);
    if (f[1] === null) {
      if (erg === null) parserOk++;
      else fehler.push('Parser: „' + f[0] + '" sollte ungültig sein');
    } else if (erg && erg.z === f[1][0] && erg.n === f[1][1]) parserOk++;
    else fehler.push('Parser: „' + f[0] + '" ergab ' + (erg ? erg.z + '/' + erg.n : 'null'));
  });
  protokoll.push({ Pruefung: 'Eingabe-Parser', Ergebnis: parserOk + ' von ' + parserFaelle.length + ' ok' });

  /* ---- 8. Formatierung und Bruch-Ausgabe (Abschnitt 8) ---- */
  const fmtFaelle = [
    [glNormalform(bGanz(1), bGanz(-1), bGanz(0)), 'x − y = 0'],
    [glNormalform(bGanz(-1), bGanz(1), bGanz(-3)), '−x + y = −3'],
    [glNormalform(bGanz(2), bGanz(0), bGanz(4)), '2x = 4'],
    [glNormalform(bGanz(-2), bGanz(1), bGanz(0), { typ: 'aufg', vari: 'y', reihenfolge: 'xb' }), 'y = 2x'],
    [glNormalform(bGanz(-1), bGanz(1), bGanz(3), { typ: 'aufg', vari: 'y', reihenfolge: 'xb' }), 'y = x + 3'],
    [glNormalform(bGanz(0), bGanz(1), bGanz(4), { typ: 'aufg', vari: 'y', reihenfolge: 'xb' }), 'y = 4'],
    [glNormalform(bGanz(-6), bGanz(2), bGanz(1), { typ: 'aufg', vari: 'y', reihenfolge: 'xb' }), 'y = 3x + 0,5']
  ];
  fmtFaelle.forEach(function (f) {
    if (glAnzeige(f[0]) !== f[1]) {
      fehler.push('Formatierung: „' + glAnzeige(f[0]) + '" statt „' + f[1] + '"');
    }
  });
  if (bAnzeigen(new Bruch(3, 4)) !== '0,75') fehler.push('bAnzeigen(3/4) sollte 0,75 sein');
  if (bAnzeigen(new Bruch(1, 3)) !== '1/3') fehler.push('bAnzeigen(1/3) sollte 1/3 sein');
  if (bAnzeigen(new Bruch(-3, 4)) !== '−0,75') fehler.push('bAnzeigen(−3/4) sollte −0,75 sein');
  if (bAnzeigen(bGanz(-12)) !== '−12') fehler.push('bAnzeigen(−12) sollte −12 sein');
  protokoll.push({ Pruefung: 'Formatierung (Abschnitt 8)', Ergebnis: 'ok' });

  /* ---- 9. Boss-Phasen (Abschnitt 9.2) ---- */
  let phasenOk = true;
  for (let i = 0; i < 20; i++) {
    const p = erzeugeBossPhasen();
    if (p.verfahren.slice().sort().join(',')
        !== VERFAHREN_LISTE.slice().sort().join(',')) {
      fehler.push('Boss-Phasen: nicht alle vier Verfahren gemischt');
      phasenOk = false; break;
    }
    if (p.sf.filter(function (s) { return s !== 'eindeutig'; }).length < 1) {
      fehler.push('Boss-Phasen ohne Sonderfall');
      phasenOk = false; break;
    }
  }
  if (phasenOk) protokoll.push({ Pruefung: 'Boss-Phasen (4 Verfahren, ≥1 Sonderfall)', Ergebnis: 'ok' });

  /* ---- 10. Werkzeuge (Abschnitt 6) ---- */
  let werkzeugFehler = 0;
  ['gleichsetzen', 'einsetzen', 'addition'].forEach(function (v) {
    for (let i = 0; i < 50; i++) {
      const auf = erzeugeAufgabe(v, 'standard', 'auto');
      const st = schwertText(auf, v);
      if (!st || st.indexOf('L =') >= 0) {
        fehler.push('Werkzeuge: schwertText ' + v + ' Nr. ' + i
          + (st ? ': verrät die Lösung: ' + st : ': leer'));
        werkzeugFehler++;
      }
      if (auf.loesung.typ === 'eindeutig') {
        const bt = bumerangText(auf.system, auf.loesung.x, auf.loesung.y);
        if (bt.split('stimmt ✓').length - 1 !== 2) {
          fehler.push('Werkzeuge: bumerangText ' + v + ' Nr. ' + i + ': Probe nicht erfüllt');
          werkzeugFehler++;
        }
      }
    }
  });
  protokoll.push({ Pruefung: 'Werkzeuge (Schwert, Bumerang, 150 Aufgaben)', Ergebnis: werkzeugFehler === 0 ? 'ok' : werkzeugFehler + ' Fehler' });

  /* Ergebnistabelle */
  console.table(protokoll);
  if (fehler.length === 0) {
    console.log('Alle Tests bestanden (Karten, Spawns, Schrift, Referenzaufgaben, ' +
      '2400 generierte Aufgaben, Lösungswege, Parser, Formatierung, Werkzeuge).');
  } else {
    console.error(fehler.length + ' Fehler:');
    fehler.forEach(function (f) { console.error(' - ' + f); });
  }
  return fehler;
}
window.selbsttest = selbsttest;
if (location.search.indexOf('test') >= 0) selbsttest();

</script>
