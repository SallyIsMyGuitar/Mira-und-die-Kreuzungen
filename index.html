<!DOCTYPE html>

<style>

  #t-rechts { left: 132px; bottom: 80px;  }

  <div class="tknopf" id="t-links">&#9664;</div>
  <div class="tknopf" id="t-rechts">&#9654;</div>
  <div class="tknopf" id="t-a">A</div>
</div>
<script>
'use strict';

/* ============================================================
   MIRA UND DIE KREUZUNGEN – Lernspiel zu linearen Gleichungssystemen
   ------------------------------------------------------------
   Eine Datei, Vanilla JS, keine externen Ressourcen.
   Aufbau nach AGENTS.md Abschnitt 10:
     1. CONFIG      8. Welt
     2. Bruch        9. Figuren
     3. Gleichung   10. Kampf
     4. Generator   11. Audio
     5. Loeser      12. Spiel
     6. Eingabe     13. Selbsttest
     7. Grafik
   ============================================================ */

/* ============================================================
   1. CONFIG – Konstanten, Palette, Niveaus
   ============================================================ */

const CONFIG = {
  BREITE: 256,            // interne Auflösung (NES)
  HOEHE: 240,
  HUD_HOEHE: 64,          // HUD-Streifen oben
  KACHEL: 16,             // Kachelgröße in Pixeln
  FELD_BREITE: 16,        // Spielfeld in Kacheln: 16 x 11
  FELD_HOEHE: 11,
  SPIELER_TEMPO: 1.5,     // Pixel pro Frame (bei 60 Bildern/s)
  MONSTER_TEMPO: 0.55,
  JAGD_TEMPO: 0.75,       // Tempo verfolgender Monster
  WECHSEL_DAUER: 30,      // Frames pro Bildschirmwechsel
  FRAME_MS: 1000 / 60
};

/* Begrenzte Palette im NES-Stil, „Modern Retro“ überarbeitet (32 Farben):
   wärmere Schatten (Violett-/Braunstich statt reinem Schwarz), kühlere
   Lichter und mehr Farbtiefe für Dithering-Verläufe.
   Indizes 0-24 behalten ihre Farbnamen (Sprite-Zeichen '0'-'9' und 'a'-'o'),
   neu sind 25-31 (Sprite-Zeichen 'p'-'v'). */
const PALETTE = [
  '#1a1424', // 0  Schwarz       – warme Tiefe statt reinem Schwarz
  '#eef0f2', // 1  Weiß          – kühles Lichtweiß
  '#a9b4c6', // 2  Hellgrau      – kühles Lichtgrau
  '#6b7186', // 3  Grau          – mittleres Grau mit kühlem Stich
  '#3c3450', // 4  Dunkelgrau    – warmviolette Schattenfläche
  '#d9434c', // 5  Rot           – Kleid, Herzen, Teppich
  '#7e1f34', // 6  Dunkelrot     – warmes Schattenrot
  '#ff8a70', // 7  Hellrot       – helles Korallenrot
  '#f49040', // 8  Orange        – warmes Orange
  '#ffd45e', // 9  Gelb          – sattes Lichtgelb
  '#e0b269', // 10 Sand          – warmer Wegesand, Schlamm
  '#8edb64', // 11 Hellgrün      – kühles Lichtgrün
  '#38a158', // 12 Grün          – sattes Wiesengrün
  '#20713a', // 13 Dunkelgrün    – Grünton für Schatten
  '#c8ecab', // 14 Blassgrün     – helles Blattgrün
  '#6cc9ea', // 15 Hellblau      – kühles Eisblau
  '#3f8ed2', // 16 Blau          – sattes Wasserblau
  '#1d4e78', // 17 Dunkelblau    – tiefes Schattenblau
  '#f3c79b', // 18 Haut          – warmer Hautton
  '#a05c2e', // 19 Braun         – mittleres warmes Braun
  '#57301f', // 20 Dunkelbraun   – tiefes Holzbraun (Haare, Stämme)
  '#f88bb4', // 21 Rosa          – Blütenrosa
  '#ffc4d2', // 22 Hellrosa      – helles Blütenrosa
  '#8a5fd1', // 23 Violett       – Zauberviolett
  '#4d2c8c', // 24 Dunkelviolett – tiefes Zauberviolett
  '#d2955f', // 25 HautSchatten  – Schatten der Haut, Holz-Mittleton (NEU)
  '#2c8a49', // 26 GrünMitte     – Mittleres Grün für Verläufe (NEU)
  '#241e33', // 27 Nacht         – tiefster warmer Schatten (NEU)
  '#fff6cf', // 28 Glanz         – Glanzpunkte, Funken, Schimmer (NEU)
  '#a8794a', // 29 SandMitte     – Mittlerer Sandton für Dithering (NEU)
  '#2c3a5e', // 30 MondBlau      – kühles Nachtblau, Titelhimmel (NEU)
  '#c98b2e'  // 31 GoldMitte     – dunkleres Gelb für Verläufe (NEU)
];

const SCHWARZ = 0, WEISS = 1, HELLGRAU = 2, GRAU = 3, DUNKELGRAU = 4,
      ROT = 5, DUNKELROT = 6, HELLROT = 7, ORANGE = 8, GELB = 9,
      SAND = 10, HELLGRUEN = 11, GRUEN = 12, DUNKELGRUEN = 13, BlassGRUEN = 14,
      HELLBLAU = 15, BLAU = 16, DUNKELBLAU = 17, HAUT = 18, BRAUN = 19,
      DUNKELBRAUN = 20, ROSA = 21, HELLROSA = 22, VIOLETT = 23, DUNKELVIOLETT = 24,
      HAUTSCHATTEN = 25, GRUENMITTE = 26, NACHT = 27, GLANZ = 28,
      SANDMITTE = 29, MONDBLAU = 30, GOLDMITTE = 31;

/* Niveaus (LehrplanPLUS M9): auf dem Titelbildschirm wählbar.
   In Etappe 1 wird die Wahl nur gespeichert, sie wirkt noch nicht. */
const NIVEAUS = ['leicht', 'standard', 'plus'];

/* Herzen je Niveau: leicht 3, standard 3, plus 2.
   Nach jedem gewonnenen Kampf laden sie sich wieder auf. */
function maxHerzen() {
  return NIVEAUS[SPIEL.niveauIndex] === 'plus' ? 2 : 3;
}

const IST_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

/* ============================================================
   2. Bruch – exakte Bruchrechnung (Abschnitt 10.2)
   ------------------------------------------------------------
   Alle Mathematik läuft über Bruch, nie über Gleitkommazahlen.
   Das Vorzeichen steckt im Zähler, der Nenner ist immer > 0,
   jeder Bruch ist vollständig gekürzt.
   ============================================================ */

function ggT(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const r = a % b; a = b; b = r; }
  return a;
}

/* Zähler für Divisionen durch 0: darf nie steigen, der Selbsttest prüft das. */
let BRUCH_NULLNENNER = 0;

class Bruch {
  constructor(zaehler, nenner) {
    if (nenner === undefined) nenner = 1;
    if (nenner === 0) { BRUCH_NULLNENNER++; zaehler = 0; nenner = 1; }   /* defensiv, darf nicht vorkommen */
    if (nenner < 0) { zaehler = -zaehler; nenner = -nenner; }
    const g = ggT(zaehler, nenner) || 1;
    this.z = zaehler / g;
    this.n = nenner / g;
  }
  istNull() { return this.z === 0; }
  istGanz() { return this.n === 1; }
  istEins() { return this.z === 1 && this.n === 1; }
  istMinusEins() { return this.z === -1 && this.n === 1; }
  istNegativ() { return this.z < 0; }
  betrag() { return new Bruch(Math.abs(this.z), this.n); }
  neg() { return new Bruch(-this.z, this.n); }
  gleich(a) { return this.z === a.z && this.n === a.n; }
  zahl() { return this.z / this.n; }   /* nur zum Zeichnen der Geraden! */
}
const bGanz = function (z) { return new Bruch(z, 1); };
const bNeg = function (a) { return new Bruch(-a.z, a.n); };
const bAdd = function (a, b) { return new Bruch(a.z * b.n + b.z * a.n, a.n * b.n); };
const bSub = function (a, b) { return new Bruch(a.z * b.n - b.z * a.n, a.n * b.n); };
const bMul = function (a, b) { return new Bruch(a.z * b.z, a.n * b.n); };
const bDiv = function (a, b) { return new Bruch(a.z * b.n, a.n * b.z); };
function bGleich(a, b) { return a.z === b.z && a.n === b.n; }

/* Exakte Dezimaldarstellung mit Komma, falls der Bruch endlich
   ist (Nenner nur aus 2ern und 5ern), sonst null. */
function bDezimal(a) {
  let n = a.n, zweier = 0, fuenfer = 0;
  while (n % 2 === 0) { n /= 2; zweier++; }
  while (n % 5 === 0) { n /= 5; fuenfer++; }
  if (n !== 1) return null;
  const k = Math.max(zweier, fuenfer);
  const ziffern = Math.abs(a.z) * Math.pow(10, k) / a.n;
  let s = String(ziffern);
  while (s.length <= k) s = '0' + s;
  let erg = k > 0 ? s.substr(0, s.length - k) + ',' + s.substr(s.length - k) : s;
  if (k > 0) erg = erg.replace(/0+$/, '').replace(/,$/, '');
  return (a.istNegativ() ? '−' : '') + erg;
}

/* Anzeige: Dezimalzahl mit Komma wenn möglich, sonst Bruch
   (Abschnitt 8: echtes Minus, Abschnitt 9.3: 0,75 oder 1/3). */
function bAnzeigen(a) {
  if (a.n === 1) return (a.istNegativ() ? '−' : '') + Math.abs(a.z);
  const d = bDezimal(a);
  if (d !== null) return d;
  return (a.istNegativ() ? '−' : '') + Math.abs(a.z) + '/' + a.n;
}

/* ============================================================
   3. Gleichung / System – Darstellung und Formatierung
   ------------------------------------------------------------
   Eine Gleichung speichert ihre Normalform a·x + b·y = c mit
   exakten Brüchen plus eine Anzeigeform (Abschnitt 8/9.3):
     normal   – Normalform (Termreihenfolge x/y beliebig)
     aufg     – nach einer Variablen aufgelöst (y = ... / x = ...)
     gemischt – Terme auf beiden Seiten (Niveau standard)
     klammer  – Klammerterm wie 3(2x − 4) + 6y = 0 (Niveau plus)
     binomX   – (px + q)² = p²x² + sy + t (plus, binomische Formel)
     binomY   – (y + q)² + ux = y · y + v (plus, binomische Formel)
   ============================================================ */

function glNormalform(a, b, c, form) {
  return { a: a, b: b, c: c, form: form || { typ: 'normal', ordnung: 'xy' } };
}

/* Eine Seite als Termfolge. Koeffizient 1 wird nicht angezeigt
   (x statt 1x), '+ −3' wird zu '− 3', Terme mit 0 entfallen,
   echtes Minus, implizite Multiplikation wie 2x (Abschnitt 8). */
function seiteAnzeigen(terme) {
  let s = '';
  for (let i = 0; i < terme.length; i++) {
    const t = terme[i];
    if (t.k.istNull()) continue;
    const minus = t.k.istNegativ();
    const betrag = t.k.betrag();
    let stueck;
    if (t.v === null) stueck = bAnzeigen(betrag);
    else if (betrag.istEins()) stueck = t.v;
    else {
      const anzeige = bAnzeigen(betrag);
      /* Bruch-Koeffizienten mit Malpunkt (1/3 · x), Dezimalzahlen
         und ganze Zahlen implizit (2x, 0,5x) – Abschnitt 8 */
      stueck = anzeige.indexOf('/') >= 0 ? anzeige + ' · ' + t.v : anzeige + t.v;
    }
    if (s === '') s = (minus ? '−' : '') + stueck;
    else s += (minus ? ' − ' : ' + ') + stueck;
  }
  return s === '' ? '0' : s;
}

function normalformAnzeige(g) {
  const tx = { k: g.a, v: 'x' }, ty = { k: g.b, v: 'y' };
  const links = (g.form.typ === 'normal' && g.form.ordnung === 'yx') ? [ty, tx] : [tx, ty];
  return seiteAnzeigen(links) + ' = ' + seiteAnzeigen([{ k: g.c, v: null }]);
}

/* Aufgelöste Form: vari = m · (andere Variable) + b */
function aufgeloestNach(g, vari) {
  if (vari === 'y') return { m: bNeg(bDiv(g.a, g.b)), b: bDiv(g.c, g.b) };
  return { m: bNeg(bDiv(g.b, g.a)), b: bDiv(g.c, g.a) };
}
function aufgeloestAnzeige(vari, m, b0, reihenfolge) {
  const t1 = { k: m, v: vari === 'y' ? 'x' : 'y' };
  const t2 = { k: b0, v: null };
  const rechts = reihenfolge === 'bx' ? seiteAnzeigen([t2, t1]) : seiteAnzeigen([t1, t2]);
  return vari + ' = ' + rechts;
}

/* Klammerform u(a·V + d) + e·W = f ; f ergibt sich aus der Normalform */
function klammerRechts(g) {
  return bAnzeigen(bAdd(g.c, bGanz(g.form.u * g.form.d)));
}

function glAnzeige(g) {
  const f = g.form;
  if (f.typ === 'normal') return normalformAnzeige(g);
  if (f.typ === 'aufg') {
    const a = aufgeloestNach(g, f.vari);
    return aufgeloestAnzeige(f.vari, a.m, a.b, f.reihenfolge);
  }
  if (f.typ === 'gemischt') {
    /* f.x/f.y/f.c: Seite ('L'/'R') jedes Terms, f.ordnung: 'xy'/'yx'.
       Auf jeder Seite zuerst die Variablenterme, dann die Konstante. */
    const lv = [], rv = [];
    const tx = { k: f.x === 'L' ? g.a : bNeg(g.a), v: 'x' };
    const ty = { k: f.y === 'L' ? g.b : bNeg(g.b), v: 'y' };
    const tc = { k: f.c === 'L' ? bNeg(g.c) : g.c, v: null };
    (f.x === 'L' ? lv : rv).push(tx);
    (f.y === 'L' ? lv : rv).push(ty);
    if (f.ordnung === 'yx') lv.reverse();
    const links = lv.slice(), rechts = rv.slice();
    if (f.c === 'L') links.push(tc); else rechts.push(tc);
    return seiteAnzeigen(links) + ' = ' + seiteAnzeigen(rechts);
  }
  if (f.typ === 'klammer') {
    let s = String(f.u) + '('
      + seiteAnzeigen([{ k: bGanz(f.a), v: f.innen }, { k: bGanz(f.d), v: null }]) + ')';
    const anderes = f.innen === 'x' ? 'y' : 'x';
    if (f.e !== 0) {
      s += (f.e < 0 ? ' − ' : ' + ') + (Math.abs(f.e) === 1 ? '' : String(Math.abs(f.e))) + anderes;
    }
    return s + ' = ' + klammerRechts(g);
  }
  if (f.typ === 'binomX') {
    const links = '(' + seiteAnzeigen([{ k: bGanz(f.p), v: 'x' }, { k: bGanz(f.q), v: null }]) + ')²';
    const rechts = seiteAnzeigen([
      { k: bGanz(f.p * f.p), v: 'x²' },
      { k: bGanz(f.s), v: 'y' },
      { k: bGanz(f.t), v: null }
    ]);
    return links + ' = ' + rechts;
  }
  if (f.typ === 'binomY') {
    let links = '(' + seiteAnzeigen([{ k: bGanz(1), v: 'y' }, { k: bGanz(f.q), v: null }]) + ')²';
    if (f.u !== 0) {
      links += (f.u < 0 ? ' − ' : ' + ') + (Math.abs(f.u) === 1 ? '' : String(Math.abs(f.u))) + 'x';
    }
    const rechts = seiteAnzeigen([{ k: bGanz(1), v: 'y · y' }, { k: bGanz(f.v), v: null }]);
    return links + ' = ' + rechts;
  }
  return normalformAnzeige(g);
}

/* Gerade aus einer Gleichung (Sonderfälle, grafisches Lösen) */
function geradeAus(g) {
  if (!g.b.istNull()) return { vertikal: false, m: bNeg(bDiv(g.a, g.b)), b: bDiv(g.c, g.b) };
  return { vertikal: true, x: bDiv(g.c, g.a), m: bGanz(0), b: bGanz(0) };
}
function geradeAnzeige(gr) {
  if (gr.vertikal) return 'x = ' + bAnzeigen(gr.x);
  return aufgeloestAnzeige('y', gr.m, gr.b, 'xb');
}

/* System lösen – unabhängig vom Generator (Abschnitt 10.5).
   Ergebnis: { typ: 'eindeutig', x, y } | { typ: 'keine' }
   | { typ: 'unendlich', gerade } */
function loeseSystem(sys) {
  const g1 = sys.g1, g2 = sys.g2;
  const det = bSub(bMul(g1.a, g2.b), bMul(g2.a, g1.b));
  if (!det.istNull()) {
    return {
      typ: 'eindeutig',
      x: bDiv(bSub(bMul(g1.c, g2.b), bMul(g2.c, g1.b)), det),
      y: bDiv(bSub(bMul(g1.a, g2.c), bMul(g2.a, g1.c)), det)
    };
  }
  /* det = 0: parallel oder identisch? (kreuzweise vergleichen) */
  const p1 = bMul(g1.a, g2.c), p2 = bMul(g2.a, g1.c);
  const q1 = bMul(g1.b, g2.c), q2 = bMul(g2.b, g1.c);
  if (bGleich(p1, p2) && bGleich(q1, q2)) return { typ: 'unendlich', gerade: geradeAus(g1) };
  return { typ: 'keine' };
}

/* Lösungsmenge nach Abschnitt 8 */
function loesungsmengeAnzeige(l) {
  if (l.typ === 'keine') return 'L = { }';
  if (l.typ === 'unendlich') return 'L = {(x|y) | ' + geradeAnzeige(l.gerade) + '}';
  return 'L = {(' + bAnzeigen(l.x) + '|' + bAnzeigen(l.y) + ')}';
}

/* Zeilenumbruch an Leerzeichen (für System- und Weganzeige).
   Rechenzeichen bleiben mit der folgenden Zahl zusammen,
   damit z.B. „− 16" nicht auseinandergerissen wird. */
function textUmbruch(text, max) {
  /* Feste Zeilenumbrüche (\n, z.B. Werkzeugtexte) zuerst trennen */
  if (text.indexOf('\n') >= 0) {
    return text.split('\n').reduce(function (z, teil) { return z.concat(textUmbruch(teil, max)); }, []);
  }
  if (text.length <= max) return [text];
  const roh = text.split(' ');
  const zwischen = [];
  for (let i = 0; i < roh.length; i++) {
    if (i + 1 < roh.length
        && (roh[i] === '−' || roh[i] === '+' || roh[i] === '=' || roh[i] === '·')) {
      zwischen.push(roh[i] + ' ' + roh[i + 1]);
      i++;
    } else zwischen.push(roh[i]);
  }
  /* Klammerterme zusammenhalten */
  const zusammen = [];
  for (let i = 0; i < zwischen.length; i++) {
    if (zwischen[i].indexOf('(') >= 0 && zwischen[i].indexOf(')') < 0) {
      let t = zwischen[i];
      while (i + 1 < zwischen.length && t.indexOf(')') < 0) { i++; t += ' ' + zwischen[i]; }
      zusammen.push(t);
    } else zusammen.push(zwischen[i]);
  }
  /* Malpunkt-Terme nicht vom Faktor trennen („− 2 · (x + 1)") */
  const woerter = [];
  for (let i = 0; i < zusammen.length; i++) {
    if (woerter.length > 0 && zusammen[i].indexOf('· ') === 0) {
      woerter[woerter.length - 1] += ' ' + zusammen[i];
    } else woerter.push(zusammen[i]);
  }
  const zeilen = [];
  let aktuell = '';
  for (let i = 0; i < woerter.length; i++) {
    const w = woerter[i];
    if (aktuell === '') aktuell = w;
    else if ((aktuell + ' ' + w).length <= max) aktuell += ' ' + w;
    else { zeilen.push(aktuell); aktuell = w; }
  }
  if (aktuell !== '') zeilen.push(aktuell);
  return zeilen;
}

/* ============================================================
   4. Generator – Aufgabenerzeugung
   ------------------------------------------------------------
   Erzeugt Aufgaben rückwärts von der gewünschten Lösung aus,
   getrennt nach Verfahren und Niveau (Abschnitt 9.3).
   Sonderfälle: leicht ca. 10 %, standard ca. 15 %, plus ca. 20 %. */

const VERFAHREN_LISTE = ['grafisch', 'gleichsetzen', 'einsetzen', 'addition'];
const SONDERFALL_WKT = { leicht: 0.10, standard: 0.15, plus: 0.20 };

/* Variable, nach der beim Gleichsetzen aufgelöst wird. Der Generator
   merkt sie sich in sys.vari (dort haben beide Gleichungen den
   Koeffizienten 1). Sonst: die aufgelöste Variable von I bzw. eine
   Variable, die in beiden Gleichungen vorkommt – nie durch 0 teilen. */
function gleichsetzVariable(sys) {
  if (sys.vari) return sys.vari;
  if (sys.g1.form.typ === 'aufg') return sys.g1.form.vari;
  if (!sys.g1.b.istNull() && !sys.g2.b.istNull()) return 'y';
  return 'x';
}

/* Verfahrens-Hinweis, passend zur konkreten Aufgabenform:
   nennt die richtige Variable und das nötige Vorgehen. */
function hinweisText(verfahren, sys) {
  if (verfahren === 'grafisch') {
    return 'Lies den Schnittpunkt ab: erst x, dann y.';
  }
  if (verfahren === 'gleichsetzen') {
    const vari = gleichsetzVariable(sys);
    const andere = vari === 'y' ? 'x' : 'y';
    if (sys.g1.form.typ === 'aufg' && sys.g2.form.typ === 'aufg') {
      return 'Beide Gleichungen sind nach ' + vari + ' aufgelöst. Setze die anderen Seiten gleich und löse nach ' + andere + '.';
    }
    return 'Forme beide Gleichungen nach ' + vari + ' um, setze dann gleich und löse.';
  }
  if (verfahren === 'einsetzen') {
    const vari = sys.g1.form.typ === 'aufg' ? sys.g1.form.vari : 'y';
    const andere = vari === 'y' ? 'x' : 'y';
    if (sys.g2.form.typ === 'klammer' || sys.g2.form.typ === 'binomX' || sys.g2.form.typ === 'binomY') {
      return 'Vereinfache zuerst II. Setze dann I ein und löse nach ' + andere + '.';
    }
    return 'I ist nach ' + vari + ' aufgelöst. Setze in II ein und löse nach ' + andere + '.';
  }
  /* Addition: je nachdem, ob schon entgegengesetzte
     Koeffizienten vorhanden sind (Abschnitt 9.3) */
  const plan = additionsPlan(sys.g1, sys.g2);
  if (plan && plan.f1 === 1 && plan.f2 === 1) {
    return 'Ein Koeffizient ist schon entgegengesetzt. Addiere I und II.';
  }
  return 'Multipliziere passend, damit ein Koeffizient entgegengesetzt ist, und addiere dann.';
}

function zg(von, bis) { return von + Math.floor(Math.random() * (bis - von + 1)); }
function zgNichtNull(von, bis) { let z = 0; while (z === 0) z = zg(von, bis); return z; }
function istSchoen(b) { return b.istGanz() || bDezimal(b) !== null; }
function klein(b, grenze) { return b.betrag().zahl() <= grenze; }
function kgVNenner(m1, m2) { return m1.n * m2.n / ggT(m1.n, m2.n); }

/* Lösungspaar je Niveau (Abschnitt 9.3) */
function erzeugeLoesungspaar(niveau) {
  if (niveau === 'leicht') return { x: bGanz(zg(-9, 9)), y: bGanz(zg(-9, 9)) };
  if (niveau === 'standard') {
    const n = Math.random() < 0.5 ? 1 : [2, 5, 10][zg(0, 2)];
    return { x: new Bruch(zg(-9 * n, 9 * n), n), y: new Bruch(zg(-9 * n, 9 * n), n) };
  }
  const n = [1, 1, 2, 2, 3, 3, 4, 5, 6, 10, 12][zg(0, 10)];
  return { x: new Bruch(zg(-9 * n, 9 * n), n), y: new Bruch(zg(-9 * n, 9 * n), n) };
}

/* Anzeigeformen zufällig wählen */
const GEMISCHT_SPECS = [];
(function () {
  const seiten = ['L', 'R'];
  for (let xi = 0; xi < 2; xi++) for (let yi = 0; yi < 2; yi++) for (let ci = 0; ci < 2; ci++) {
    const x = seiten[xi], y = seiten[yi], c = seiten[ci];
    if (x === 'L' && y === 'L' && c === 'L') continue;   /* alles links */
    if (x === 'R' && y === 'R' && c === 'R') continue;   /* alles rechts */
    if (x === 'R' && y === 'L' && c === 'R') continue;   /* schon nach y aufgelöst */
    if (y === 'R' && x === 'L' && c === 'R') continue;   /* schon nach x aufgelöst */
    GEMISCHT_SPECS.push({ x: x, y: y, c: c });
  }
})();
function gemischtForm() {
  const s = GEMISCHT_SPECS[zg(0, GEMISCHT_SPECS.length - 1)];
  return { typ: 'gemischt', x: s.x, y: s.y, c: s.c, ordnung: Math.random() < 0.5 ? 'xy' : 'yx' };
}
function normalFormZufall() { return { typ: 'normal', ordnung: Math.random() < 0.5 ? 'xy' : 'yx' }; }
function aufgForm(vari) { return { typ: 'aufg', vari: vari, reihenfolge: Math.random() < 0.5 ? 'xb' : 'bx' }; }

/* plus: Normalform mit Klammer- oder Binomform dekorieren,
   wenn die Koeffizienten das hergeben (Abschnitt 9.3). */
function dekoriereKlammer(g, innen) {
  const feldK = innen === 'x' ? g.a : g.b;   /* Koeffizient der inneren Variablen */
  const feldE = innen === 'x' ? g.b : g.a;   /* Koeffizient der anderen Variablen */
  /* Nur mit positivem Koeffizienten dekorieren (3(2x − 4) + 6y = 0),
     sonst bliebe ein unschöner negativer Vorfaktor. */
  if (!feldK.istGanz() || feldK.z < 2) return null;
  const teiler = [];
  for (let t = 2; t <= feldK.z; t++) if (feldK.z % t === 0) teiler.push(t);
  const t = teiler[zg(0, teiler.length - 1)];
  const u = t;
  const aIn = feldK.z / t;
  const d = zgNichtNull(-5, 5);
  const f = bAdd(g.c, bGanz(u * d));
  if (!f.istGanz() || Math.abs(f.z) > 20) return null;
  return { typ: 'klammer', u: u, a: aIn, d: d, e: feldE.z, innen: innen };
}
function dekoriereBinomX(g) {
  /* (px + q)² = p²x² + sy + t  →  Normalform: 2pq·x − s·y = t − q² */
  if (!g.a.istGanz() || !g.b.istGanz() || g.b.istNull()) return null;
  const kandidaten = [];
  for (let p = 1; p <= 4; p++) {
    if (g.a.z % (2 * p) !== 0) continue;
    const q = g.a.z / (2 * p);
    if (q === 0 || Math.abs(q) > 6) continue;
    const t = g.c.z + q * q;
    if (Math.abs(t) > 20) continue;
    kandidaten.push({ p: p, q: q, t: t });
  }
  if (!kandidaten.length) return null;
  const k = kandidaten[zg(0, kandidaten.length - 1)];
  return { typ: 'binomX', p: k.p, q: k.q, s: -g.b.z, t: k.t };
}
function dekoriereBinomY(g) {
  /* (y + q)² + ux = y · y + v  →  Normalform: u·x + 2q·y = v − q² */
  if (!g.a.istGanz() || !g.b.istGanz() || g.a.istNull() || g.b.istNull()) return null;
  if (g.b.z % 2 !== 0) return null;
  const q = g.b.z / 2;
  if (q === 0 || Math.abs(q) > 6) return null;
  const v = g.c.z + q * q;
  if (Math.abs(v) > 20) return null;
  return { typ: 'binomY', q: q, u: g.a.z, v: v };
}

/* ---------- grafisch: Schnittpunkt immer ganzzahlig ---------- */
/* ---------- grafisch: Schnittpunkt immer ganzzahlig ---------- */
function steigungFuerNiveau(niveau) {
  if (niveau === 'leicht') return bGanz(zg(-3, 3));
  if (niveau === 'standard') {
    return Math.random() < 0.5 ? bGanz(zg(-3, 3)) : new Bruch(zg(-6, 6), 2);
  }
  const n = [2, 3, 4][zg(0, 2)];
  return new Bruch(zg(-4 * n, 4 * n), n);
}

function erzeugeGrafisch(niveau, sf) {
  for (let versuch = 0; versuch < 400; versuch++) {
    /* Bei parallelen bzw. identischen Geraden (Sonderfälle) ist die
       Steigung gemeinsam, sonst wird sie unabhängig gewählt. */
    const m1 = steigungFuerNiveau(niveau);
    const m2 = sf === 'eindeutig' ? steigungFuerNiveau(niveau) : m1;

    if (sf === 'eindeutig') {
      if (bGleich(m1, m2)) continue;
      const kgN = kgVNenner(m1, m2);
      const q = Math.floor(6 / kgN);
      if (q === 0) continue;
      const x0 = zg(-q, q) * kgN;      /* Vielfaches des Nenners → ganzzahliger y-Wert */
      const y0 = zg(-6, 6);
      const b1 = bSub(bGanz(y0), bMul(m1, bGanz(x0)));
      const b2 = bSub(bGanz(y0), bMul(m2, bGanz(x0)));
      if (!b1.istGanz() || !b2.istGanz()) continue;
      if (Math.abs(b1.z) > 8 || Math.abs(b2.z) > 8) continue;
      const g1 = glNormalform(bNeg(m1), bGanz(1), b1, { typ: 'aufg', vari: 'y', reihenfolge: 'xb' });
      const g2 = glNormalform(bNeg(m2), bGanz(1), b2, { typ: 'aufg', vari: 'y', reihenfolge: 'xb' });
      if (glAnzeige(g1) === glAnzeige(g2)) continue;
      return {
        system: { g1: g1, g2: g2, verfahren: 'grafisch' },
        loesung: { typ: 'eindeutig', x: bGanz(x0), y: bGanz(y0) }
      };
    }

    if (sf === 'keine') {
      /* Parallel: gleiche Steigung, aber unabhängige
         y-Achsenabschnitte – die Geraden schneiden sich nie. */
      const b1 = bGanz(zg(-8, 8));
      const b2 = bGanz(zg(-8, 8));
      if (b1.z === b2.z) continue;
      const g1 = glNormalform(bNeg(m1), bGanz(1), b1, { typ: 'aufg', vari: 'y', reihenfolge: 'xb' });
      const g2 = glNormalform(bNeg(m1), bGanz(1), b2, { typ: 'aufg', vari: 'y', reihenfolge: 'xb' });
      if (glAnzeige(g1) === glAnzeige(g2)) continue;
      return { system: { g1: g1, g2: g2, verfahren: 'grafisch' }, loesung: { typ: 'keine' } };
    }

    /* unendlich viele Lösungen: beide Gleichungen zeigen dieselbe
       Gerade, die zweite nur anders dargestellt (m ≠ 0). */
    if (m1.istNull()) continue;
    const q = Math.floor(6 / m1.n);
    if (q === 0) continue;
    const x0 = zg(-q, q) * m1.n;
    const y0 = zg(-6, 6);
    const b1 = bSub(bGanz(y0), bMul(m1, bGanz(x0)));
    if (!b1.istGanz() || Math.abs(b1.z) > 8) continue;
    const g1 = glNormalform(bNeg(m1), bGanz(1), b1, { typ: 'aufg', vari: 'y', reihenfolge: 'xb' });
    const g2 = glNormalform(bNeg(m1), bGanz(1), b1, { typ: 'aufg', vari: 'y', reihenfolge: 'bx' });
    if (glAnzeige(g1) === glAnzeige(g2)) continue;
    return {
      system: { g1: g1, g2: g2, verfahren: 'grafisch' },
      loesung: { typ: 'unendlich', gerade: geradeAus(g1) }
    };
  }
  return null;
}

/* ---------- Gleichsetzen: beide nach derselben Variablen ---------- */
function gleichsetzenSteigung(niveau) {
  if (niveau === 'leicht') return bGanz(zgNichtNull(-4, 4));
  if (niveau === 'standard') return bGanz(zg(-5, 5));
  const n = [2, 3, 4, 5, 6][zg(0, 4)];
  return new Bruch(zgNichtNull(-3 * n, 3 * n), n);
}

function erzeugeGleichsetzen(niveau, sf) {
  for (let versuch = 0; versuch < 400; versuch++) {
    const vari = niveau === 'plus' ? 'y' : (Math.random() < 0.7 ? 'y' : 'x');
    const m1 = gleichsetzenSteigung(niveau);
    const m2 = sf === 'eindeutig' ? gleichsetzenSteigung(niveau) : m1;
    const kopf = function (m) {
      return vari === 'y' ? [bNeg(m), bGanz(1)] : [bGanz(1), bNeg(m)];
    };

    if (sf === 'eindeutig') {
      if (bGleich(m1, m2)) continue;
      const lsg = erzeugeLoesungspaar(niveau);
      const b1 = bSub(lsg[vari], bMul(m1, lsg[vari === 'y' ? 'x' : 'y']));
      const b2 = bSub(lsg[vari], bMul(m2, lsg[vari === 'y' ? 'x' : 'y']));
      if (niveau === 'plus') {
        if (!istSchoen(b1) || !istSchoen(b2) || !klein(b1, 20) || !klein(b2, 20)) continue;
      } else {
        if (!b1.istGanz() || !b2.istGanz()) continue;
        if (Math.abs(b1.z) > 20 || Math.abs(b2.z) > 20) continue;
      }
      let form1, form2;
      if (niveau === 'leicht') { form1 = aufgForm(vari); form2 = aufgForm(vari); }
      else if (niveau === 'standard') { form1 = gemischtForm(); form2 = gemischtForm(); }
      else { form1 = aufgForm(vari); form2 = { typ: 'aufg', vari: vari, reihenfolge: form1.reihenfolge === 'xb' ? 'bx' : 'xb' }; }
      const k1 = kopf(m1), k2 = kopf(m2);
      const g1 = glNormalform(k1[0], k1[1], b1, form1);
      const g2 = glNormalform(k2[0], k2[1], b2, form2);
      if (glAnzeige(g1) === glAnzeige(g2)) continue;
      return {
        system: { g1: g1, g2: g2, verfahren: 'gleichsetzen', vari: vari },
        loesung: { typ: 'eindeutig', x: lsg.x, y: lsg.y }
      };
    }

    if (sf === 'keine') {
      /* Parallel: gleiche Steigung, unabhängiger Achsenabschnitt */
      const b1 = bGanz(zg(-9, 9));
      const b2 = bGanz(zg(-9, 9));
      if (b1.z === b2.z) continue;
      let form1, form2;
      if (niveau === 'standard') { form1 = gemischtForm(); form2 = gemischtForm(); }
      else { form1 = aufgForm(vari); form2 = aufgForm(vari); }
      const k = kopf(m1);
      const g1 = glNormalform(k[0], k[1], b1, form1);
      const g2 = glNormalform(k[0], k[1], b2, form2);
      if (glAnzeige(g1) === glAnzeige(g2)) continue;
      return { system: { g1: g1, g2: g2, verfahren: 'gleichsetzen', vari: vari }, loesung: { typ: 'keine' } };
    }

    /* unendlich viele Lösungen: identische Gleichung, zweite nur
       anders dargestellt (m ≠ 0, sonst gleiche Anzeige) */
    if (m1.istNull()) continue;
    const lsg = erzeugeLoesungspaar(niveau);
    const b1 = bSub(lsg[vari], bMul(m1, lsg[vari === 'y' ? 'x' : 'y']));
    if (niveau === 'plus') { if (!istSchoen(b1) || !klein(b1, 20)) continue; }
    else { if (!b1.istGanz() || Math.abs(b1.z) > 20) continue; }
    let form1, form2;
    if (niveau === 'standard') { form1 = gemischtForm(); form2 = gemischtForm(); }
    else { form1 = { typ: 'aufg', vari: vari, reihenfolge: 'xb' }; form2 = { typ: 'aufg', vari: vari, reihenfolge: 'bx' }; }
    const k = kopf(m1);
    const g1 = glNormalform(k[0], k[1], b1, form1);
    const g2 = glNormalform(k[0], k[1], b1, form2);
    if (glAnzeige(g1) === glAnzeige(g2)) continue;
    return {
      system: { g1: g1, g2: g2, verfahren: 'gleichsetzen', vari: vari },
      loesung: { typ: 'unendlich', gerade: geradeAus(g1) }
    };
  }
  return null;
}

/* ---------- Einsetzen: I aufgelöst, II Normalform-artig ---------- */
function erzeugeEinsetzen(niveau, sf) {
  for (let versuch = 0; versuch < 400; versuch++) {
    const vari = Math.random() < 0.6 ? 'y' : 'x';
    const andere = vari === 'y' ? 'x' : 'y';
    let m;
    if (niveau === 'leicht') m = bGanz(zgNichtNull(-4, 4));
    else if (niveau === 'standard') m = bGanz(zg(-5, 5));
    else { const n = [2, 3, 4, 5, 6][zg(0, 4)]; m = new Bruch(zgNichtNull(-3 * n, 3 * n), n); }
    const lsg = erzeugeLoesungspaar(niveau);
    const b0 = bSub(lsg[vari], bMul(m, lsg[andere]));
    if (niveau === 'plus') { if (!istSchoen(b0) || !klein(b0, 20)) continue; }
    else { if (!b0.istGanz() || Math.abs(b0.z) > 20) continue; }

    let a2, b2, c2, t = 1;
    if (sf === 'eindeutig') {
      a2 = bGanz(zgNichtNull(-6, 6));
      b2 = bGanz(zgNichtNull(-6, 6));
      /* det ≠ 0: II darf nicht zur I-Geraden parallel sein */
      const kNeu = vari === 'y' ? bAdd(a2, bMul(b2, m)) : bAdd(b2, bMul(a2, m));
      if (kNeu.istNull()) continue;
      c2 = bAdd(bMul(a2, lsg.x), bMul(b2, lsg.y));
    } else {
      /* II proportional zur I-Normalform (t·(−m, 1, b0) bzw. t·(1, −m, b0)) */
      if (niveau === 'plus') t = m.istGanz() ? zgNichtNull(-3, 3) : m.n * zgNichtNull(-2, 2);
      else t = zgNichtNull(-3, 3);
      if (vari === 'y') { a2 = bMul(bGanz(-t), m); b2 = bGanz(t); }
      else { b2 = bMul(bGanz(-t), m); a2 = bGanz(t); }
      if (!a2.istGanz() || !b2.istGanz()) continue;
      c2 = bMul(bGanz(t), b0);
      if (sf === 'keine') c2 = bAdd(c2, bGanz(zgNichtNull(-6, 6)));
    }
    if (!c2.istGanz() || Math.abs(c2.z) > 20) continue;
    if (Math.abs(a2.z) > 20 || Math.abs(b2.z) > 20) continue;

    const g1 = glNormalform(
      vari === 'y' ? bNeg(m) : bGanz(1),
      vari === 'y' ? bGanz(1) : bNeg(m),
      b0, aufgForm(vari));
    const g2 = glNormalform(a2, b2, c2);
    if (niveau === 'leicht') g2.form = normalFormZufall();
    else if (niveau === 'standard') g2.form = gemischtForm();
    else if (sf === 'eindeutig') {
      const r = Math.random();
      const deko = r < 0.3 ? dekoriereKlammer(g2, 'x')
        : r < 0.5 ? dekoriereBinomX(g2)
        : r < 0.65 ? dekoriereBinomY(g2)
        : null;
      g2.form = deko || normalFormZufall();
    } else g2.form = normalFormZufall();
    if (glAnzeige(g1) === glAnzeige(g2)) continue;
    const loesung = sf === 'eindeutig' ? { typ: 'eindeutig', x: lsg.x, y: lsg.y }
      : (sf === 'keine' ? { typ: 'keine' } : { typ: 'unendlich', gerade: geradeAus(g1) });
    return { system: { g1: g1, g2: g2, verfahren: 'einsetzen' }, loesung: loesung };
  }
  return null;
}

/* ---------- Addition: beide in Normalform ---------- */
function erzeugeAddition(niveau, sf) {
  for (let versuch = 0; versuch < 400; versuch++) {
    const lsg = erzeugeLoesungspaar(niveau);
    let a1, b1, a2, b2, t = 1;
    if (sf === 'eindeutig') {
      if (niveau === 'leicht') {
        /* schon passend: ein Koeffizientenpaar ist entgegengesetzt */
        a1 = zgNichtNull(-5, 5); b1 = zgNichtNull(-5, 5);
        if (Math.random() < 0.5) { a2 = -a1; b2 = zgNichtNull(-5, 5); }
        else { b2 = -b1; a2 = zgNichtNull(-5, 5); }
      } else {
        a1 = zgNichtNull(-6, 6); b1 = zgNichtNull(-6, 6);
        a2 = zgNichtNull(-6, 6); b2 = zgNichtNull(-6, 6);
        /* standard/plus: es muss erst multipliziert werden */
        if (a2 === -a1 || b2 === -b1) continue;
      }
      if (a1 * b2 - a2 * b1 === 0) continue;
    } else {
      a1 = zgNichtNull(-5, 5); b1 = zgNichtNull(-5, 5);
      t = zgNichtNull(-3, 3);
      a2 = t * a1; b2 = t * b1;
    }
    const c1 = bAdd(bMul(bGanz(a1), lsg.x), bMul(bGanz(b1), lsg.y));
    let c2;
    if (sf === 'unendlich') c2 = bMul(bGanz(t), c1);
    else if (sf === 'keine') c2 = bAdd(bMul(bGanz(t), c1), bGanz(zgNichtNull(-6, 6)));
    else c2 = bAdd(bMul(bGanz(a2), lsg.x), bMul(bGanz(b2), lsg.y));
    if (!c1.istGanz() || !c2.istGanz()) continue;
    if (Math.abs(c1.z) > 20 || Math.abs(c2.z) > 20) continue;
    const g1 = glNormalform(bGanz(a1), bGanz(b1), c1);
    const g2 = glNormalform(bGanz(a2), bGanz(b2), c2);
    if (niveau === 'leicht') { g1.form = normalFormZufall(); g2.form = normalFormZufall(); }
    else if (niveau === 'standard') {
      g1.form = Math.random() < 0.5 ? normalFormZufall() : gemischtForm();
      g2.form = Math.random() < 0.5 ? normalFormZufall() : gemischtForm();
    } else {
      const deko = function (gg,binomYOk) {
        const r = Math.random();
        if (r < 0.3) return dekoriereKlammer(gg, 'x');
        if (r < 0.5) return dekoriereBinomX(gg);
        if (r < 0.65 && binomYOk) return dekoriereBinomY(gg);
        return null;
      };
      g1.form = deko(g1, false) || normalFormZufall();
      g2.form = deko(g2, true) || normalFormZufall();
    }
    if (glAnzeige(g1) === glAnzeige(g2)) continue;
    const loesung = sf === 'eindeutig' ? { typ: 'eindeutig', x: lsg.x, y: lsg.y }
      : (sf === 'keine' ? { typ: 'keine' } : { typ: 'unendlich', gerade: geradeAus(g1) });
    return { system: { g1: g1, g2: g2, verfahren: 'addition' }, loesung: loesung };
  }
  return null;
}

function erzeugeAufgabe(verfahren, niveau, sfTyp) {
  let sf = sfTyp;
  if (sf === 'auto' || sf === undefined) {
    sf = Math.random() < SONDERFALL_WKT[niveau]
      ? (Math.random() < 0.5 ? 'keine' : 'unendlich') : 'eindeutig';
  }
  let auf = null;
  for (let i = 0; i < 60 && !auf; i++) {
    if (verfahren === 'grafisch') auf = erzeugeGrafisch(niveau, sf);
    else if (verfahren === 'gleichsetzen') auf = erzeugeGleichsetzen(niveau, sf);
    else if (verfahren === 'einsetzen') auf = erzeugeEinsetzen(niveau, sf);
    else if (verfahren === 'addition') auf = erzeugeAddition(niveau, sf);
  }
  if (!auf) {   /* Notfall: einfachste Stufe desselben Verfahrens */
    if (verfahren === 'grafisch') auf = erzeugeGrafisch('leicht', 'eindeutig');
    else if (verfahren === 'gleichsetzen') auf = erzeugeGleichsetzen('leicht', 'eindeutig');
    else if (verfahren === 'einsetzen') auf = erzeugeEinsetzen('leicht', 'eindeutig');
    else auf = erzeugeAddition('leicht', 'eindeutig');
  }
  /* sfTyp immer aus der tatsächlichen Lösung ableiten, damit
     Kennzeichnung, Statistik und Aufgabenwiederholung stimmen */
  auf.sfTyp = auf.loesung.typ;
  auf.hinweis = hinweisText(verfahren, auf.system);
  auf.luecke = lueckeText(verfahren, auf);
  return auf;
}

/* Lückenschritte (leicht, 9.3) – kompakt gehalten, damit sie
   neben der Hinweis-Schaltfläche Platz finden. */
function lueckeText(verfahren, auf) {
  const sys = auf.system;
  if (verfahren === 'grafisch') return 'S(__|__) ablesen';
  if (verfahren === 'gleichsetzen') {
    const vari = gleichsetzVariable(sys);
    return 'Gleichsetzen: __·' + (vari === 'y' ? 'x' : 'y') + ' = __';
  }
  if (verfahren === 'einsetzen') {
    const vari = sys.g1.form.vari;
    return 'Einsetzen: __·' + (vari === 'y' ? 'x' : 'y') + ' = __';
  }
  const plan = additionsPlan(sys.g1, sys.g2);
  return 'I + II: __·' + (plan && plan.elim === 'x' ? 'y' : 'x') + ' = __';
}

/* ============================================================
   5. Loeser – Lösungsweg Schritt für Schritt
   ------------------------------------------------------------
   Löst jedes System unabhängig vom Generator und erzeugt den
   Lösungsweg im jeweiligen Verfahren Zeile für Zeile, wie im
   Heft: Umformen der Ausgangsgleichungen, Lösen, Probe (11). */

/* Additionsplan: Eliminationsvariable mit den kleinsten
   Multiplikationsfaktoren; Faktoren immer positiv, bei gleichen
   Vorzeichen wird subtrahiert (I − II), sonst addiert (I + II). */
function additionsPlan(g1, g2) {
  function planFuer(k1w, k2w, elim) {
    const az1 = Math.abs(k1w), az2 = Math.abs(k2w);
    if (az1 === 0 || az2 === 0) return null;
    const g = ggT(az1, az2);
    const f1 = az2 / g, f2 = az1 / g;
    const subtrahieren = (k1w > 0) === (k2w > 0);
    return { elim: elim, f1: f1, f2: f2, op: subtrahieren ? '−' : '+', score: f1 + f2 };
  }
  const planX = planFuer(g1.a.z, g2.a.z, 'x');
  const planY = planFuer(g1.b.z, g2.b.z, 'y');
  if (planX && planY) return planX.score <= planY.score ? planX : planY;
  return planX || planY;
}

function glMult(g, k) {
  return glNormalform(bMul(g.a, bGanz(k)), bMul(g.b, bGanz(k)), bMul(g.c, bGanz(k)), g.form);
}

/* Zwischenschritte beim Vereinfachen (plus: Klammern, binomische Formeln) */
function klammerAus(g) {
  const f = g.form;
  const anderes = f.innen === 'x' ? 'y' : 'x';
  return seiteAnzeigen([
    { k: bGanz(f.u * f.a), v: f.innen },
    { k: bGanz(f.u * f.d), v: null },
    { k: bGanz(f.e), v: anderes }
  ]) + ' = ' + klammerRechts(g);
}
function binomXAus(g) {
  const f = g.form;
  return seiteAnzeigen([
    { k: bGanz(f.p * f.p), v: 'x²' }, { k: bGanz(2 * f.p * f.q), v: 'x' }, { k: bGanz(f.q * f.q), v: null }
  ]) + ' = ' + seiteAnzeigen([
    { k: bGanz(f.p * f.p), v: 'x²' }, { k: bGanz(f.s), v: 'y' }, { k: bGanz(f.t), v: null }
  ]);
}
function binomXLinear(g) {
  const f = g.form;
  return seiteAnzeigen([{ k: bGanz(2 * f.p * f.q), v: 'x' }, { k: bGanz(f.q * f.q), v: null }])
    + ' = ' + seiteAnzeigen([{ k: bGanz(f.s), v: 'y' }, { k: bGanz(f.t), v: null }]);
}
function binomYAus(g) {
  const f = g.form;
  return seiteAnzeigen([
    { k: bGanz(1), v: 'y²' }, { k: bGanz(2 * f.q), v: 'y' },
    { k: bGanz(f.q * f.q), v: null }, { k: bGanz(f.u), v: 'x' }
  ]) + ' = ' + seiteAnzeigen([{ k: bGanz(1), v: 'y · y' }, { k: bGanz(f.v), v: null }]);
}
function binomYLinear(g) {
  const f = g.form;
  return seiteAnzeigen([{ k: bGanz(2 * f.q), v: 'y' }, { k: bGanz(f.q * f.q), v: null }, { k: bGanz(f.u), v: 'x' }])
    + ' = ' + seiteAnzeigen([{ k: bGanz(f.v), v: null }]);
}

/* Vorarbeit: Ausgangsgleichung in Normalform oder in die
   aufgelöste Form überführen; ergibt Kopf- und Umformzeilen. */
function vorarbeit(g, name, ziel) {
  const schritte = [];
  const f = g.form;
  const normal = normalformAnzeige(g);
  /* Überführung in die Normalform – nur wenn sich dabei etwas
     ändert. Gemischt-Formen, die nur die Termreihenfolge ändern
     (alles links außer der Konstanten), sind schon Normalform. */
  const nurOrdnung = (f.typ === 'gemischt' && f.x === 'L' && f.y === 'L' && f.c === 'R');
  const brauchtNormal = (f.typ === 'klammer' || f.typ === 'binomX' || f.typ === 'binomY'
    || (f.typ === 'gemischt' && !nurOrdnung));
  if (brauchtNormal) {
    if (f.typ === 'gemischt') schritte.push('→ ' + normal);
    else if (f.typ === 'klammer') { schritte.push('→ ' + klammerAus(g)); schritte.push('→ ' + normal); }
    else if (f.typ === 'binomX') { schritte.push('→ ' + binomXAus(g)); schritte.push('→ ' + binomXLinear(g)); schritte.push('→ ' + normal); }
    else if (f.typ === 'binomY') { schritte.push('→ ' + binomYAus(g)); schritte.push('→ ' + binomYLinear(g)); schritte.push('→ ' + normal); }
  }
  if (ziel === 'y' || ziel === 'x') {
    if (f.typ === 'aufg' && f.vari === ziel) {
      return { kopf: name + ': ' + glAnzeige(g), schritte: [] };
    }
    const a = aufgeloestNach(g, ziel);
    const aufg = aufgeloestAnzeige(ziel, a.m, a.b, 'xb');
    /* Schritt weglassen, wenn die Anzeige schon der aufgelösten
       Form entspricht (z.B. bei wegfallendem x-Term) */
    if (aufg !== glAnzeige(g) && schritte[schritte.length - 1] !== '→ ' + aufg) schritte.push('→ ' + aufg);
  }
  return { kopf: name + ': ' + glAnzeige(g), schritte: schritte };
}

/* Zahlenterme mit Malpunkt (Abschnitt 8): „2 · 3", „−2 · (−3)" */
function zahlKlammern(b) { return b.istNegativ() ? '(' + bAnzeigen(b) + ')' : bAnzeigen(b); }
function zahlTerm(k, wert) {
  const ks = k.betrag().istEins() ? '' : bAnzeigen(k.betrag()) + ' · ';
  return ks + zahlKlammern(wert);
}
function faktorTerm(k, wert) {
  return (k.istNegativ() ? '−' : '') + zahlTerm(k, wert);
}
function rechteSeiteZahlen(m, wert, b0) {
  if (m.istNull()) return bAnzeigen(b0);
  let s = faktorTerm(m, wert);
  if (!b0.istNull()) s += (b0.istNegativ() ? ' − ' : ' + ') + bAnzeigen(b0.betrag());
  return s;
}
function stueckeVerknuepfen(st) {
  let s = '';
  for (let i = 0; i < st.length; i++) {
    s += (i === 0 ? (st[i].neg ? '−' : '') : (st[i].neg ? ' − ' : ' + ')) + st[i].text;
  }
  return s === '' ? '0' : s;
}
function probeZeile(sys, name, l) {
  const g = name === 'I' ? sys.g1 : sys.g2;
  const st = [];
  if (!g.a.istNull()) st.push({ text: zahlTerm(g.a, l.x), neg: g.a.istNegativ() });
  if (!g.b.istNull()) st.push({ text: zahlTerm(g.b, l.y), neg: g.b.istNegativ() });
  return 'Probe ' + name + ': ' + stueckeVerknuepfen(st) + ' = ' + bAnzeigen(g.c) + ' ✓';
}

/* Der vollständige Lösungsweg im jeweiligen Verfahren (11). */
function erzeugeWeg(sys, verfahren, l) {
  const Z = [];
  function wz(text) { textUmbruch(text, 29).forEach(function (z) { Z.push(z); }); }
  function vor(name, g, ziel) {
    const v = vorarbeit(g, name, ziel);
    wz((name === 'I' ? '' : '∧ ') + v.kopf);
    for (let i = 0; i < v.schritte.length; i++) wz('   ' + v.schritte[i]);
  }

  if (verfahren === 'grafisch') {
    const gr1 = geradeAus(sys.g1), gr2 = geradeAus(sys.g2);
    wz('I: ' + glAnzeige(sys.g1));
    wz('∧ II: ' + glAnzeige(sys.g2));
    Z.push('');
    if (l.typ === 'eindeutig') {
      wz('Ablesen: S(' + bAnzeigen(l.x) + '|' + bAnzeigen(l.y) + ')');
      Z.push('');
      wz('Probe I: ' + bAnzeigen(l.y) + ' = ' + rechteSeiteZahlen(gr1.m, l.x, gr1.b));
      wz('Probe II: ' + bAnzeigen(l.y) + ' = ' + rechteSeiteZahlen(gr2.m, l.x, gr2.b));
      Z.push('');
      wz(loesungsmengeAnzeige(l));
    } else if (l.typ === 'keine') {
      wz('Beide Geraden haben die Steigung ' + bAnzeigen(gr1.m) + '.');
      wz('Sie sind parallel und schneiden sich nie.');
      Z.push('');
      wz('L = { }');
    } else {
      wz('Beide Gleichungen beschreiben dieselbe');
      wz('Gerade – jeder ihrer Punkte ist eine Lösung.');
      Z.push('');
      wz('L = {(x|y) | ' + geradeAnzeige(gr1) + '}');
    }
    return Z;
  }

  if (verfahren === 'gleichsetzen') {
    const vari = gleichsetzVariable(sys);
    const andere = vari === 'y' ? 'x' : 'y';
    vor('I', sys.g1, vari);
    vor('II', sys.g2, vari);
    Z.push('');
    const a1 = aufgeloestNach(sys.g1, vari), a2 = aufgeloestNach(sys.g2, vari);
    wz('Gleichsetzen: ' + seiteAnzeigen([{ k: a1.m, v: andere }, { k: a1.b, v: null }])
      + ' = ' + seiteAnzeigen([{ k: a2.m, v: andere }, { k: a2.b, v: null }]));
    if (l.typ === 'eindeutig') {
      const k = bSub(a1.m, a2.m);
      if (!k.istEins()) {
        wz(seiteAnzeigen([{ k: k, v: andere }]) + ' = ' + bAnzeigen(bSub(a2.b, a1.b)));
      }
      wz(andere + ' = ' + bAnzeigen(andere === 'x' ? l.x : l.y));
      Z.push('');
      const rhs = rechteSeiteZahlen(a1.m, andere === 'x' ? l.x : l.y, a1.b);
      const erg = bAnzeigen(vari === 'y' ? l.y : l.x);
      if (rhs !== erg) wz('Einsetzen in I: ' + vari + ' = ' + rhs);
      wz(vari + ' = ' + erg);
      Z.push('');
      wz(probeZeile(sys, 'II', l));
      Z.push('');
      wz(loesungsmengeAnzeige(l));
    } else if (l.typ === 'keine') {
      wz(bAnzeigen(a1.b) + ' = ' + bAnzeigen(a2.b));
      wz('Das ist ein Widerspruch:');
      wz('kein Schnittpunkt, keine Lösung!');
      Z.push('');
      wz('L = { }');
    } else {
      wz('Das ist immer wahr – beide Gleichungen');
      wz('gehören zur selben Geraden!');
      Z.push('');
      wz('L = {(x|y) | ' + geradeAnzeige(geradeAus(sys.g1)) + '}');
    }
    return Z;
  }

  if (verfahren === 'einsetzen') {
    const vari = sys.g1.form.vari;
    const andere = vari === 'y' ? 'x' : 'y';
    vor('I', sys.g1, vari);
    vor('II', sys.g2, 'normal');
    Z.push('');
    const a1 = aufgeloestNach(sys.g1, vari);
    const g2 = sys.g2;
    const kSym = vari === 'y' ? g2.a : g2.b;     /* Term, der Symbol bleibt */
    const kErsetzt = vari === 'y' ? g2.b : g2.a; /* Koeffizient des eingesetzten Terms */
    const klammer = '(' + seiteAnzeigen([{ k: a1.m, v: andere }, { k: a1.b, v: null }]) + ')';
    const st = [];
    if (!kSym.istNull()) st.push({ text: seiteAnzeigen([{ k: kSym.betrag(), v: andere }]), neg: kSym.istNegativ() });
    st.push({
      text: kErsetzt.betrag().istEins() ? klammer : bAnzeigen(kErsetzt.betrag()) + ' · ' + klammer,
      neg: kErsetzt.istNegativ()
    });
    wz('Einsetzen in II: ' + stueckeVerknuepfen(st) + ' = ' + bAnzeigen(g2.c));
    const kNeu = bAdd(kSym, bMul(kErsetzt, a1.m));
    const cNeu = bSub(g2.c, bMul(kErsetzt, a1.b));
    const ausmult = '→ ' + seiteAnzeigen([
      { k: kSym, v: andere }, { k: bMul(kErsetzt, a1.m), v: andere }, { k: bMul(kErsetzt, a1.b), v: null }
    ]) + ' = ' + bAnzeigen(g2.c);
    const zusammen = '→ ' + seiteAnzeigen([{ k: kNeu, v: andere }]) + ' = ' + bAnzeigen(cNeu);
    if (ausmult !== zusammen) wz(ausmult);
    wz(zusammen);
    if (l.typ === 'eindeutig') {
      wz(andere + ' = ' + bAnzeigen(andere === 'x' ? l.x : l.y));
      Z.push('');
      const rhs = rechteSeiteZahlen(a1.m, andere === 'x' ? l.x : l.y, a1.b);
      const erg = bAnzeigen(vari === 'y' ? l.y : l.x);
      if (rhs !== erg) wz('Einsetzen in I: ' + vari + ' = ' + rhs);
      wz(vari + ' = ' + erg);
      Z.push('');
      wz(probeZeile(sys, 'II', l));
      Z.push('');
      wz(loesungsmengeAnzeige(l));
    } else if (!cNeu.istNull()) {
      wz('Widerspruch – die eingesetzte');
      wz('Gleichung ist nie erfüllt. Keine Lösung!');
      Z.push('');
      wz('L = { }');
    } else {
      wz('Immer wahr – beide Gleichungen');
      wz('beschreiben dieselbe Gerade!');
      Z.push('');
      wz('L = {(x|y) | ' + geradeAnzeige(geradeAus(sys.g1)) + '}');
    }
    return Z;
  }

  /* ---------- Additionsverfahren ---------- */
  vor('I', sys.g1, 'normal');
  vor('II', sys.g2, 'normal');
  Z.push('');
  const plan = additionsPlan(sys.g1, sys.g2);
  const g1m = glMult(sys.g1, plan.f1), g2m = glMult(sys.g2, plan.f2);
  if (plan.f1 !== 1) wz('I · ' + plan.f1 + ': ' + normalformAnzeige(g1m));
  if (plan.f2 !== 1) wz('II · ' + plan.f2 + ': ' + normalformAnzeige(g2m));
  const sA = plan.op === '−' ? bSub(g1m.a, g2m.a) : bAdd(g1m.a, g2m.a);
  const sB = plan.op === '−' ? bSub(g1m.b, g2m.b) : bAdd(g1m.b, g2m.b);
  const sC = plan.op === '−' ? bSub(g1m.c, g2m.c) : bAdd(g1m.c, g2m.c);
  const opText = plan.op === '−' ? 'I − II' : 'I + II';
  const zielVar = plan.elim === 'x' ? 'y' : 'x';
  const koeff = plan.elim === 'x' ? sB : sA;
  if (l.typ !== 'eindeutig') {
    wz(opText + ': 0 = ' + bAnzeigen(sC));
    if (!sC.istNull()) {
      wz('Widerspruch – die Gleichungen passen');
      wz('nie zusammen. Keine Lösung!');
      Z.push('');
      wz('L = { }');
    } else {
      wz('Immer wahr – beide Gleichungen');
      wz('beschreiben dieselbe Gerade!');
      Z.push('');
      wz('L = {(x|y) | ' + geradeAnzeige(geradeAus(sys.g1)) + '}');
    }
    return Z;
  }
  wz(opText + ': ' + seiteAnzeigen([{ k: koeff, v: zielVar }]) + ' = ' + bAnzeigen(sC));
  wz(zielVar + ' = ' + bAnzeigen(zielVar === 'x' ? l.x : l.y));
  Z.push('');
  /* Einsetzen in eine Gleichung, die die eliminierte Variable noch enthält */
  const gI = plan.elim === 'x' ? (sys.g1.a.istNull() ? sys.g2 : sys.g1)
    : (sys.g1.b.istNull() ? sys.g2 : sys.g1);
  const nameI = gI === sys.g1 ? 'I' : 'II';
  const zielWert = zielVar === 'x' ? l.x : l.y;
  const kSym2 = plan.elim === 'x' ? gI.a : gI.b;
  const kBek = plan.elim === 'x' ? gI.b : gI.a;
  const st = [];
  if (!kSym2.istNull()) st.push({ text: seiteAnzeigen([{ k: kSym2.betrag(), v: plan.elim }]), neg: kSym2.istNegativ() });
  if (!kBek.istNull()) st.push({ text: zahlTerm(kBek, zielWert), neg: kBek.istNegativ() });
  wz('Einsetzen in ' + nameI + ': ' + stueckeVerknuepfen(st) + ' = ' + bAnzeigen(gI.c));
  wz('→ ' + seiteAnzeigen([{ k: kSym2, v: plan.elim }]) + ' = ' + bAnzeigen(bSub(gI.c, bMul(kBek, zielWert))));
  wz(plan.elim + ' = ' + bAnzeigen(plan.elim === 'x' ? l.x : l.y));
  Z.push('');
  wz(probeZeile(sys, nameI === 'I' ? 'II' : 'I', l));
  Z.push('');
  wz(loesungsmengeAnzeige(l));
  return Z;
}

/* ============================================================
   6. Eingabe – Parser für Zahleneingaben, Antwortprüfung
   ------------------------------------------------------------
   Akzeptiert 0,75 / 0.75 / 3/4 / -3/4 / −3/4 und Leerzeichen
   (Abschnitt 8). Ungültige Eingaben ergeben null. */

function parseEingabe(s) {
  s = (s || '').replace(/\s+/g, '').replace(/-/g, '−');
  if (s === '') return null;
  let vorzeichen = false;
  if (s.charAt(0) === '−') { vorzeichen = true; s = s.substr(1); }
  if (s === '') return null;
  const vf = vorzeichen ? -1 : 1;
  const teile = s.split('/');
  if (teile.length === 2) {
    if (!/^\d+$/.test(teile[0]) || !/^\d+$/.test(teile[1])) return null;
    const n = parseInt(teile[1], 10);
    if (n === 0) return null;
    return new Bruch(vf * parseInt(teile[0], 10), n);
  }
  if (teile.length > 2) return null;
  if (!/^\d+([.,]\d+)?$/.test(s)) return null;
  const komma = s.split(/[.,]/);
  if (komma.length === 2) {
    const z = parseInt(komma[0] + komma[1], 10);
    return new Bruch(vf * z, Math.pow(10, komma[1].length));
  }
  return new Bruch(vf * parseInt(s, 10), 1);
}

/* Antwortprüfung mit Erkennung typischer Fehler (Abschnitt 11).
   Rückgabe { richtig, hinweis }. */
function pruefeAntwort(loesung, antwort) {
  if (loesung.typ === 'eindeutig') {
    if (antwort.typ === 'paar') {
      const xR = bGleich(antwort.x, loesung.x);
      const yR = bGleich(antwort.y, loesung.y);
      if (xR && yR) return { richtig: true, hinweis: '' };
      if (bGleich(antwort.x, loesung.x.neg()) && bGleich(antwort.y, loesung.y.neg()))
        return { richtig: false, hinweis: 'Deine Werte sind genau negativ. Pass auf die Vorzeichen auf!' };
      if (bGleich(antwort.x, loesung.y) && bGleich(antwort.y, loesung.x))
        return { richtig: false, hinweis: 'x und y sind bei dir vertauscht.' };
      if (xR || yR)
        return { richtig: false, hinweis: 'Ein Wert stimmt schon! Hast du den zweiten Wert richtig eingesetzt?' };
      return { richtig: false, hinweis: 'Vergleiche deine Rechnung mit dem Lösungsweg.' };
    }
    return { richtig: false, hinweis: 'Hier gibt es genau eine Lösung – einen Schnittpunkt.' };
  }
  if (antwort.typ !== 'paar') {
    if (antwort.typ === loesung.typ) return { richtig: true, hinweis: '' };
    return { richtig: false, hinweis: loesung.typ === 'keine'
      ? 'Es gibt gar keine Lösung.'
      : 'Es gibt unendlich viele Lösungen.' };
  }
  return { richtig: false, hinweis: loesung.typ === 'keine'
    ? 'Die Gleichungen passen nie zusammen – es gibt keine Lösung!'
    : 'Beide Gleichungen beschreiben dieselbe Gerade – es gibt unendlich viele Lösungen!' };
}

const glyphenCache = new Map();
function glyphe(zeichen, farbe) {
  const schluessel = zeichen + '|' + farbe;
  if (glyphenCache.has(schluessel)) return glyphenCache.get(schluessel);
  const c = document.createElement('canvas');
  c.width = 8; c.height = 8;
  const g = c.getContext('2d');
  const hex = SCHRIFT[zeichen] || SCHRIFT['?'];
  g.fillStyle = PALETTE[farbe];
  for (let zeile = 0; zeile < 8; zeile++) {
    const bits = parseInt(hex.substr(zeile * 2, 2), 16);
    for (let spalte = 0; spalte < 8; spalte++) {
      if (bits & (0x80 >> spalte)) g.fillRect(spalte, zeile, 1, 1);
    }
  }
  glyphenCache.set(schluessel, c);
  return c;
}

function zeichneText(g, text, x, y, farbe, skala) {
  farbe = (farbe === undefined) ? WEISS : farbe;
  skala = skala || 1;
  for (let i = 0; i < text.length; i++) {
    g.drawImage(glyphe(text[i], farbe), x + i * 8 * skala, y, 8 * skala, 8 * skala);
  }
}
function textBreite(text, skala) { return text.length * 8 * (skala || 1); }
function zeichneTextMitte(g, text, y, farbe, skala) {
  zeichneText(g, text, Math.floor((CONFIG.BREITE - textBreite(text, skala)) / 2), y, farbe, skala);
}

/* ---------- 7.2 Sprites ----------
   Pixel-Arrays: '.' = durchsichtig, '0'-'9'/'a'-'v' = Palettenindex. */
function zeichenIndex(zeichen) {
  const code = zeichen.charCodeAt(0);
  if (code >= 48 && code <= 57) return code - 48;   // '0'-'9'
  return 10 + (code - 97);                          // 'a'-'o'
}
function spriteErzeugen(zeilen) {
  const c = document.createElement('canvas');
  c.width = zeilen[0].length; c.height = zeilen.length;
  const g = c.getContext('2d');
  for (let y = 0; y < zeilen.length; y++) {
    for (let x = 0; x < zeilen[y].length; x++) {
      const zeichen = zeilen[y][x];
      if (zeichen === '.') continue;
      g.fillStyle = PALETTE[zeichenIndex(zeichen)];
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}
function zeichneSprite(g, spr, x, y, spiegeln, skala) {
  skala = skala || 1;
  x = Math.round(x); y = Math.round(y);
  const b = spr.width * skala, h = spr.height * skala;
  if (spiegeln) {
    g.save(); g.translate(x + b, y); g.scale(-1, 1);
    g.drawImage(spr, 0, 0, b, h);
    g.restore();
  } else {
    g.drawImage(spr, x, y, b, h);
  }
}
