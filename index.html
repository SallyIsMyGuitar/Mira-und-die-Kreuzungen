/* ---------- 7.3 Kacheln (16x16, je Gebiet eigene Farben) ----------
   Die Kacheln werden einmal pro (Gebiet, Kachelcode) in ein kleines
   Canvas vorgerendert und dann nur noch kopiert. */
function rauschen(x, y, samen) {
  const n = Math.sin(x * 127.1 + y * 311.7 + samen * 74.7) * 43758.5453;
  return n - Math.floor(n);
}

/* Dezentes Schachbrett-Dithering für weiche Verläufe („Modern Retro“). */
function dither(g, x, y, b, h, farbe, phase) {
  g.fillStyle = farbe;
  const p = phase || 0;
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < b; i++) {
      if (((x + i + y + j + p) & 1) === 0) g.fillRect(x + i, y + j, 1, 1);
    }
  }
}

/* Weicher Rand zu Nachbarböden: 2 Pixel Dithering
   (maske: 1 = oben, 2 = rechts, 4 = unten, 8 = links). */
function randWeich(g, maske, farbe, farbeHell) {
  if (maske & 1) { dither(g, 0, 0, 16, 2, farbe); dither(g, 0, 0, 16, 1, farbeHell, 1); }
  if (maske & 4) { dither(g, 0, 14, 16, 2, farbe); dither(g, 0, 15, 16, 1, farbeHell, 1); }
  if (maske & 8) { dither(g, 0, 0, 2, 16, farbe); dither(g, 0, 0, 1, 16, farbeHell, 1); }
  if (maske & 2) { dither(g, 14, 0, 2, 16, farbe); dither(g, 15, 0, 1, 16, farbeHell, 1); }
}

/* Baum: drei Töne, Lichtkante oben links, Schatten unten rechts. */
function baumMalen(g, hell, mitte, dunkel, stamm, stammDunkel, y0) {
  const breiten = [6, 8, 10, 12, 12, 12, 12, 10, 8, 6];
  /* 1. Kronenschatten (bleibt unten rechts sichtbar) */
  g.fillStyle = dunkel;
  for (let i = 0; i < breiten.length; i++) {
    g.fillRect(8 - breiten[i] / 2, y0 + i, breiten[i], 1);
  }
  /* 2. Mitteltere: rechts 2 Pixel und unten 2 Zeilen Schatten lassen */
  g.fillStyle = mitte;
  for (let i = 0; i < breiten.length - 2; i++) {
    g.fillRect(8 - breiten[i] / 2, y0 + i, breiten[i] - 2, 1);
  }
  /* 3. Lichtkante oben links */
  g.fillStyle = hell;
  g.fillRect(6, y0, 2, 1); g.fillRect(5, y0 + 1, 2, 1);
  g.fillRect(4, y0 + 2, 3, 1); g.fillRect(3, y0 + 3, 3, 1);
  g.fillRect(3, y0 + 4, 2, 1);
  /* 4. Glanzpunkte */
  g.fillStyle = PALETTE[GLANZ];
  g.fillRect(7, y0 + 1, 1, 1); g.fillRect(5, y0 + 3, 1, 1);
  /* 5. Stamm: Lichtkante links, Schattenseite rechts */
  g.fillStyle = stamm; g.fillRect(7, y0 + 10, 1, 16 - (y0 + 10));
  g.fillStyle = stammDunkel; g.fillRect(8, y0 + 10, 1, 16 - (y0 + 10));
}

function torMalen(g, frame) {
  /* Zaubertor: blockiert den Durchgang, bis das Gebiet geschafft ist.
     Pfosten mit Facette, Zauberfeld flimmert (2 Frames). */
  const F = PALETTE;
  const fr = frame || 0;
  g.fillStyle = F[GRAU];      g.fillRect(2, 1, 3, 14); g.fillRect(11, 1, 3, 14);
  g.fillStyle = F[HELLGRAU]; g.fillRect(2, 1, 3, 1); g.fillRect(2, 2, 1, 13);
  g.fillRect(11, 1, 3, 1); g.fillRect(11, 2, 1, 13);
  g.fillStyle = F[DUNKELGRAU]; g.fillRect(4, 2, 1, 13); g.fillRect(13, 2, 1, 13);
  g.fillRect(2, 14, 3, 1); g.fillRect(11, 14, 3, 1);
  g.fillStyle = F[VIOLETT];
  for (let y = 3; y < 15; y += 2) g.fillRect(6, y, 4, 1);
  g.fillStyle = F[DUNKELVIOLETT];
  for (let y = 4; y < 15; y += 2) g.fillRect(7, y, 2, 1);
  /* Funkeln wandert mit dem Animationsframe */
  g.fillStyle = F[GLANZ];
  if (fr & 1) { g.fillRect(6, 8, 1, 1); g.fillRect(8, 13, 1, 1); }
  else { g.fillRect(7, 5, 1, 1); g.fillRect(6, 11, 1, 1); }
}

/* Fackel an Wänden (Höhle, Burg): Flackern über 3 Frames, ohne Zufall. */
function fackelMalen(g, fr) {
  const F = PALETTE;
  g.fillStyle = F[BRAUN]; g.fillRect(7, 9, 2, 3);
  g.fillStyle = F[DUNKELBRAUN]; g.fillRect(7, 11, 2, 1);
  g.fillStyle = F[ORANGE];
  g.fillRect(7, 4 - (fr === 2 ? 1 : 0), 2, 4 + (fr === 1 ? 1 : 0));
  g.fillStyle = F[GELB];
  g.fillRect(7, 6 - (fr === 2 ? 1 : 0), 2, 2);
  g.fillStyle = F[GLANZ];
  g.fillRect(7 + (fr & 1), 4 - (fr === 2 ? 1 : 0), 1, 1);
}
function malKachel(g, gebietId, code, variante, frame, maske) {
  const F = PALETTE;
  const v = variante || 0;      /* Bodenvariante: fest pro Kachelposition */
  const fr = frame || 0;       /* Animationsframe (Gras, Wasser, Fackeln …) */
  const m = maske || 0;        /* weiche Ränder zu Wegen und Wasser */
  const fleck = function (samen, dichte, farbe) {
    g.fillStyle = farbe;
    for (let y = 0; y < 16; y++) {
      for (let x = 0; x < 16; x++) {
        if (rauschen(x, y, samen) < dichte) g.fillRect(x, y, 1, 1);
      }
    }
  };

  if (gebietId === 'wiese') {
    const gras = function (dichte) {
      g.fillStyle = F[GRUEN]; g.fillRect(0, 0, 16, 16);
      /* weiche Flecken in drei Grüntönen, fest je Variante */
      const schatten = [[1, 10], [9, 1], [2, 3], [10, 8]][v];
      dither(g, schatten[0], schatten[1], 5, 4, F[DUNKELGRUEN]);
      dither(g, schatten[0] + 2, schatten[1] + 2, 3, 2, F[GRUENMITTE]);
      const licht = [[9, 11], [2, 6], [11, 12], [4, 2]][v];
      dither(g, licht[0], licht[1], 4, 3, F[HELLGRUEN]);
      fleck(10 + v, dichte || 0.04, F[DUNKELGRUEN]);
      /* Grasbüschel, dessen Spitze sich wiegt (2 Frames) */
      const bx = [[2, 4], [10, 9], [6, 12], [12, 3]][v];
      g.fillStyle = F[DUNKELGRUEN];
      g.fillRect(bx[0], bx[1], 1, 2);
      g.fillRect(bx[0] + 2, bx[1] + 1, 1, 2);
      g.fillRect(bx[0] + 1 + fr, bx[1] - 1, 1, 3);
      g.fillStyle = F[GRUENMITTE];
      g.fillRect(bx[0] + 1, bx[1] + 1, 1, 1);
    };
    if (code === '.') { gras(); }
    else if (code === ',') { gras(0.07); }
    else if (code === 'f') {
      gras();
      /* zwei Blumen: Blüten in drei Tönen mit Stiel */
      const vers = [[0, 0], [1, 1], [0, 1], [1, 0]][v];
      [[4, 4], [9, 7]].forEach(function (p, i) {
        const x = p[0] + vers[i], y = p[1] + vers[1];
        g.fillStyle = F[GRUENMITTE]; g.fillRect(x + 1, y + 3, 1, 3);
        g.fillStyle = F[ROSA];
        g.fillRect(x, y, 3, 1); g.fillRect(x - 1, y + 1, 5, 1); g.fillRect(x, y + 2, 3, 1);
        g.fillStyle = F[HELLROSA]; g.fillRect(x, y, 1, 1); g.fillRect(x - 1, y + 1, 1, 1);
        g.fillStyle = F[GELB]; g.fillRect(x + 1, y + 1, 1, 1);
      });
    }
    else if (code === 'o') { gras(); baumMalen(g, F[HELLGRUEN], F[GRUEN], F[DUNKELGRUEN], F[BRAUN], F[DUNKELBRAUN], 2); }
    else if (code === '#') {
      g.fillStyle = F[DUNKELGRUEN]; g.fillRect(0, 0, 16, 16);
      baumMalen(g, F[HELLGRUEN], F[GRUEN], F[DUNKELGRUEN], F[BRAUN], F[DUNKELBRAUN], 0);
    }
    else if (code === 'p') {
      g.fillStyle = F[SAND]; g.fillRect(0, 0, 16, 16);
      fleck(30 + v, 0.08, F[SANDMITTE]);
      fleck(40 + v, 0.05, F[DUNKELBRAUN]);
      fleck(50 + v, 0.03, F[HAUT]);
      randWeich(g, m, F[GRUEN], F[DUNKELGRUEN]);
    }
    else if (code === 'x') { gras(); torMalen(g, fr); }
    else { gras(); }

  } else if (gebietId === 'wald') {
    const boden = function () {
      g.fillStyle = F[DUNKELGRAU]; g.fillRect(0, 0, 16, 16);
      /* Moos in drei Tönen und Schattenflecken, fest je Variante */
      const moos = [[2, 2], [9, 8], [4, 10], [11, 3]][v];
      dither(g, moos[0], moos[1], 5, 4, F[DUNKELGRUEN]);
      dither(g, moos[0] + 1, moos[1] + 1, 3, 2, F[GRUENMITTE]);
      const schatten = [[9, 11], [1, 6], [12, 2], [5, 12]][v];
      dither(g, schatten[0], schatten[1], 4, 3, F[NACHT]);
      fleck(10 + v, 0.04, F[GRUENMITTE]);
    };
    if (code === '.') { boden(); }
    else if (code === ',') { boden(); fleck(30 + v, 0.05, F[NACHT]); }
    else if (code === 'b') {
      boden();
      /* Busch: Schatten unten rechts, Licht oben links */
      const breiten = [4, 6, 8, 8, 6, 4];
      g.fillStyle = F[DUNKELGRUEN];
      for (let i = 0; i < breiten.length; i++) g.fillRect(8 - breiten[i] / 2, 9 + i, breiten[i], 1);
      g.fillStyle = F[GRUEN];
      for (let i = 0; i < breiten.length - 1; i++) g.fillRect(8 - breiten[i] / 2, 9 + i, breiten[i] - 1, 1);
      g.fillStyle = F[HELLGRUEN]; g.fillRect(7, 9, 2, 1); g.fillRect(6, 10, 2, 1);
      /* Glanzpunkt wandert (2 Frames) */
      g.fillStyle = F[GLANZ]; g.fillRect(fr & 1 ? 6 : 7, fr & 1 ? 11 : 10, 1, 1);
    }
    else if (code === 'o') { boden(); baumMalen(g, F[HELLGRUEN], F[GRUEN], F[DUNKELGRUEN], F[BRAUN], F[DUNKELBRAUN], 2); }
    else if (code === '#') {
      g.fillStyle = F[DUNKELGRAU]; g.fillRect(0, 0, 16, 16);
      baumMalen(g, F[HELLGRUEN], F[GRUEN], F[DUNKELGRUEN], F[BRAUN], F[DUNKELBRAUN], 0);
    }
    else if (code === 'p') {
      g.fillStyle = F[SAND]; g.fillRect(0, 0, 16, 16);
      fleck(30 + v, 0.08, F[SANDMITTE]);
      fleck(40 + v, 0.05, F[DUNKELBRAUN]);
      fleck(50 + v, 0.03, F[HAUT]);
      randWeich(g, m, F[DUNKELGRAU], F[DUNKELGRUEN]);
    }
    else if (code === 'x') { boden(); torMalen(g, fr); }
    else { boden(); }

  } else if (gebietId === 'sumpf') {
    const schlamm = function () {
      g.fillStyle = F[SAND]; g.fillRect(0, 0, 16, 16);
      const schatten = [[1, 9], [8, 2], [3, 3], [11, 10]][v];
      dither(g, schatten[0], schatten[1], 5, 4, F[SANDMITTE]);
      dither(g, schatten[0] + 2, schatten[1] + 2, 3, 2, F[BRAUN]);
      fleck(10 + v, 0.05, F[BRAUN]);
      fleck(20 + v, 0.03, F[DUNKELGRUEN]);
      fleck(30 + v, 0.03, F[HAUT]);
    };
    if (code === '.') { schlamm(); }
    else if (code === ',') { schlamm(); fleck(40 + v, 0.06, F[SANDMITTE]); }
    else if (code === '~') {
      /* Wasser: drei Blautöne mit weicher Uferkante */
      g.fillStyle = F[BLAU]; g.fillRect(0, 0, 16, 16);
      fleck(50 + v, 0.10, F[DUNKELBLAU]);
      dither(g, 0, 13, 16, 3, F[DUNKELBLAU]);
      /* Wellen wandern, Glitzerpunkt wechselt (2 Frames) */
      g.fillStyle = F[HELLBLAU];
      g.fillRect(1 + v + fr, 3, 3, 1); g.fillRect(9 - v - fr, 7, 3, 1); g.fillRect(4 + v + fr, 11, 3, 1);
      g.fillStyle = F[GLANZ];
      g.fillRect(fr ? 11 : 3, fr ? 9 : 5, 1, 1);
      /* Ufer: Schlamm-Dithering außen, helle Wasserlinie innen */
      if (m & 1) {
        dither(g, 0, 0, 16, 2, F[SANDMITTE]); dither(g, 0, 0, 16, 1, F[SAND], 1);
        g.fillStyle = F[HELLBLAU];
        for (let x = 1; x < 15; x += 2) g.fillRect(x, 2, 1, 1);
      }
      if (m & 4) {
        dither(g, 0, 14, 16, 2, F[SANDMITTE]); dither(g, 0, 15, 16, 1, F[SAND], 1);
        g.fillStyle = F[HELLBLAU];
        for (let x = 1; x < 15; x += 2) g.fillRect(x, 13, 1, 1);
      }
      if (m & 8) {
        dither(g, 0, 0, 2, 16, F[SANDMITTE]); dither(g, 0, 0, 1, 16, F[SAND], 1);
        g.fillStyle = F[HELLBLAU];
        for (let y = 1; y < 15; y += 2) g.fillRect(2, y, 1, 1);
      }
      if (m & 2) {
        dither(g, 14, 0, 2, 16, F[SANDMITTE]); dither(g, 15, 0, 1, 16, F[SAND], 1);
        g.fillStyle = F[HELLBLAU];
        for (let y = 1; y < 15; y += 2) g.fillRect(13, y, 1, 1);
      }
    }
    else if (code === 'o') {
      schlamm();
      /* Schilf: Lichtkante, Schatten, Kolben mit Glanz */
      [3, 7, 11].forEach(function (x, i) {
        g.fillStyle = F[DUNKELGRUEN]; g.fillRect(x, 4, 1, 11);
        g.fillStyle = F[GRUENMITTE];  g.fillRect(x - 1, 6 + i * 3, 1, 3);
        g.fillStyle = F[BRAUN];       g.fillRect(x, 1, 1, 3);
        g.fillStyle = F[HAUT];        g.fillRect(x, 1, 1, 1);
      });
    }
    else if (code === '#') {
      g.fillStyle = F[DUNKELGRUEN]; g.fillRect(0, 0, 16, 16);
      [1, 4, 7, 10, 13].forEach(function (x) {
        g.fillStyle = F[GRUEN]; g.fillRect(x, 2, 1, 14);
        g.fillStyle = F[GRUENMITTE]; g.fillRect(x, 2, 1, 2);
      });
      [1, 7, 13].forEach(function (x) {
        g.fillStyle = F[BRAUN]; g.fillRect(x, 0, 1, 4);
        g.fillStyle = F[HAUT]; g.fillRect(x, 0, 1, 1);
      });
    }
    else if (code === 'p') {
      /* Bohlenweg: Planken mit Lichtkante und Schattenfugen */
      g.fillStyle = F[BRAUN]; g.fillRect(0, 0, 16, 16);
      g.fillStyle = F[DUNKELBRAUN];
      [3, 7, 11, 15].forEach(function (y) { g.fillRect(0, y, 16, 1); });
      g.fillRect(2, 1, 1, 1); g.fillRect(13, 1, 1, 1);
      g.fillRect(2, 5, 1, 1); g.fillRect(13, 9, 1, 1);
      [0, 4, 8, 12].forEach(function (y) { dither(g, 0, y, 16, 1, F[HAUT], 1); });
      randWeich(g, m, F[SAND], F[SANDMITTE]);
    }
    else if (code === 'x') { schlamm(); torMalen(g, fr); }
    else { schlamm(); }

  } else if (gebietId === 'hoehle') {
    const boden = function () {
      g.fillStyle = F[GRAU]; g.fillRect(0, 0, 16, 16);
      const schatten = [[2, 9], [9, 2], [4, 4], [11, 11]][v];
      dither(g, schatten[0], schatten[1], 5, 4, F[DUNKELGRAU]);
      dither(g, schatten[0] + 1, schatten[1] + 1, 3, 2, F[NACHT]);
      fleck(10 + v, 0.05, F[DUNKELGRAU]);
      fleck(20 + v, 0.03, F[HELLGRAU]);
    };
    if (code === '.') { boden(); }
    else if (code === ',') { boden(); fleck(30 + v, 0.06, F[NACHT]); }
    else if (code === 'o') {
      boden();
      /* Fels: Licht oben links, Risse unten rechts */
      const breiten = [6, 8, 10, 12, 12, 12, 10, 8];
      g.fillStyle = F[DUNKELGRAU];
      for (let i = 0; i < breiten.length; i++) g.fillRect(8 - breiten[i] / 2, 4 + i, breiten[i], 1);
      g.fillStyle = F[GRAU];
      for (let i = 0; i < breiten.length - 1; i++) g.fillRect(8 - breiten[i] / 2, 4 + i, breiten[i] - 2, 1);
      g.fillStyle = F[HELLGRAU];
      g.fillRect(6, 4, 3, 1); g.fillRect(5, 5, 3, 1); g.fillRect(4, 6, 2, 1);
      g.fillStyle = F[WEISS]; g.fillRect(6, 5, 1, 1);
      g.fillStyle = F[NACHT]; g.fillRect(9, 9, 1, 2); g.fillRect(6, 10, 2, 1);
    }
    else if (code === '#') {
      g.fillStyle = F[DUNKELGRAU]; g.fillRect(0, 0, 16, 16);
      g.fillStyle = F[HELLGRAU]; g.fillRect(0, 0, 16, 1);
      dither(g, 0, 1, 16, 2, F[GRAU]);
      g.fillStyle = F[NACHT];
      g.fillRect(3, 4, 1, 3); g.fillRect(9, 8, 1, 4); g.fillRect(13, 2, 1, 2);
      g.fillRect(0, 15, 16, 1);
      /* Fackel auf manchen Wandkacheln: flackert über 3 Frames */
      if (v === 0) fackelMalen(g, fr);
    }
    else if (code === 'p') {
      g.fillStyle = F[HELLGRAU]; g.fillRect(0, 0, 16, 16);
      fleck(30 + v, 0.08, F[GRAU]);
      fleck(40 + v, 0.02, F[WEISS]);
      randWeich(g, m, F[GRAU], F[DUNKELGRAU]);
    }
    else if (code === 'f') {
      boden();
      /* Kristalle: Lichtkante links, Schattenbasis, Glanzspitze pulsiert */
      [[4, 8, 4], [8, 6, 6], [11, 9, 3]].forEach(function (k) {
        g.fillStyle = F[HELLBLAU]; g.fillRect(k[0], k[1], 1, k[2]);
        g.fillStyle = F[BLAU]; g.fillRect(k[0] + 1, k[1] + 1, 1, k[2] - 1);
        g.fillStyle = F[DUNKELBLAU]; g.fillRect(k[0] + 1, k[1] + k[2] - 2, 1, 2);
        if (fr & 1) { g.fillStyle = F[HELLBLAU]; g.fillRect(k[0] + 1, k[1] + 1, 1, 1); }
        g.fillStyle = F[GLANZ]; g.fillRect(k[0], k[1] + (fr & 1 ? 2 : 1), 1, 1);
      });
    }
    else if (code === 'x') { boden(); torMalen(g, fr); }
    else { boden(); }

  } else if (gebietId === 'burg') {
    const boden = function () {
      g.fillStyle = F[HELLGRAU]; g.fillRect(0, 0, 16, 16);
      g.fillStyle = F[GRAU];
      g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 16);
      fleck(10 + v, 0.04, F[GRAU]);
      fleck(20 + v, 0.02, F[WEISS]);
      /* Steinfliesen je Variante leicht abgedunkelt */
      if (v === 1) dither(g, 8, 8, 8, 8, F[GRAU]);
      if (v === 2) dither(g, 0, 8, 8, 8, F[GRAU]);
    };
    if (code === '.') { boden(); }
    else if (code === ',') { boden(); }
    else if (code === 'p') { boden(); fleck(30 + v, 0.02, F[WEISS]); }
    else if (code === 'c') {
      /* Teppich: Facette, Emblem mit Glanz und Schatten */
      g.fillStyle = F[ROT]; g.fillRect(0, 0, 16, 16);
      g.fillStyle = F[DUNKELROT];
      g.fillRect(0, 0, 16, 1); g.fillRect(0, 15, 16, 1);
      g.fillRect(0, 0, 1, 16); g.fillRect(15, 0, 1, 16);
      dither(g, 1, 12, 14, 3, F[DUNKELROT]);
      g.fillStyle = F[GELB];
      [[7, 6], [8, 6], [6, 7], [9, 7], [6, 8], [9, 8], [7, 9], [8, 9]]
        .forEach(function (p) { g.fillRect(p[0], p[1], 1, 1); });
      /* Emblem schimmert (2 Frames) */
      g.fillStyle = F[GLANZ]; g.fillRect(fr & 1 ? 8 : 7, 6, 1, 1);
      g.fillStyle = F[GOLDMITTE]; g.fillRect(8, 9, 1, 1);
    }
    else if (code === 'o') {
      boden();
      g.fillStyle = F[GRAU];       g.fillRect(4, 0, 8, 16);
      g.fillStyle = F[HELLGRAU];   g.fillRect(4, 0, 2, 16);
      g.fillStyle = F[DUNKELGRAU]; g.fillRect(10, 0, 2, 16);
      g.fillRect(2, 0, 12, 2); g.fillRect(2, 13, 12, 3);
      g.fillStyle = F[NACHT]; g.fillRect(2, 15, 12, 1);
    }
    else if (code === '#') {
      g.fillStyle = F[DUNKELGRAU]; g.fillRect(0, 0, 16, 16);
      g.fillStyle = F[GRAU];
      g.fillRect(0, 5, 16, 1); g.fillRect(0, 11, 16, 1);
      g.fillRect(5, 0, 1, 5);  g.fillRect(11, 0, 1, 5);
      g.fillRect(2, 6, 1, 5);  g.fillRect(8, 6, 1, 5);  g.fillRect(14, 6, 1, 5);
      g.fillRect(5, 12, 1, 4); g.fillRect(11, 12, 1, 4);
      g.fillStyle = F[HELLGRAU]; g.fillRect(0, 0, 16, 1);
      g.fillStyle = F[NACHT];
      g.fillRect(0, 15, 16, 1); g.fillRect(5, 4, 1, 1); g.fillRect(11, 4, 1, 1);
      g.fillRect(2, 10, 1, 1); g.fillRect(8, 10, 1, 1); g.fillRect(14, 10, 1, 1);
      /* Fackel auf manchen Wandkacheln: flackert über 3 Frames */
      if (v === 0) fackelMalen(g, fr);
    }
    else { boden(); }
  }
}

const KACHELN = {};

/* Fest pro Kachelposition: Bodenvariante (zufällig, aber ohne Flimmern).
   Wände bekommen 8 Varianten, damit Fackeln selten bleiben. */
function kachelVariante(tx, ty, bi, n) {
  return Math.floor(rauschen(tx * 3.13 + bi * 7.77, ty * 5.71, 511) * (n || 4));
}

/* Animationsframe pro Kachelcode: Gras wiegt sich, Wasser glitzert,
   Kristalle pulsieren, Fackeln flackern – über wenige Frames,
   ohne Zufall pro Frame. */
function kachelFrame(code, tx, ty) {
  const f = SPIEL.frame;
  if (code === '#') return ((f >> 3) + tx * 2 + ty * 3) % 3;   /* Fackeln: 3 Frames */
  if (code === '~') return ((f >> 3) + tx + ty * 2) & 1;        /* Wasser glitzert */
  if (code === 'f' || code === 'b' || code === 'x' || code === 'c') {
    return ((f >> 3) + tx * 2 + ty) & 1;                       /* Kristalle, Busch, Tor, Teppich */
  }
  return ((f >> 4) + tx * 2 + ty * 3) & 1;                     /* Gras wiegt sich */
}

/* Randmaske für weiche Übergänge zu Wegen und Wasser
   (Bit 1 = oben, 2 = rechts, 4 = unten, 8 = links). */
const RAND_BODEN = { '.': true, ',': true, 'f': true, 'b': true, 'c': true };
function kachelRand(code, karte, tx, ty) {
  if (code !== 'p' && code !== '~') return 0;
  const amBoden = function (x, y) {
    return x >= 0 && x < CONFIG.FELD_BREITE && y >= 0 && y < CONFIG.FELD_HOEHE
      && RAND_BODEN[karte[y][x]] === true;
  };
  let maske = 0;
  if (amBoden(tx, ty - 1)) maske |= 1;
  if (amBoden(tx + 1, ty)) maske |= 2;
  if (amBoden(tx, ty + 1)) maske |= 4;
  if (amBoden(tx - 1, ty)) maske |= 8;
  return maske;
}

/* Alle Kacheln werden je (Gebiet, Code, Variante, Frame, Rand) einmal in
   ein Offscreen-Canvas vorgerendert und dann nur kopiert – so bleibt
   das Spiel auch auf dem iPad schnell (Abschnitt 3). */
function kachel(gebietId, code, variante, frame, maske) {
  variante = variante || 0; frame = frame || 0; maske = maske || 0;
  if (!KACHELN[gebietId]) KACHELN[gebietId] = {};
  const bank = KACHELN[gebietId];
  if (!bank[code]) bank[code] = {};
  const key = (variante * 8 + frame) * 16 + maske;
  if (!bank[code][key]) {
    const c = document.createElement('canvas');
    c.width = CONFIG.KACHEL; c.height = CONFIG.KACHEL;
    malKachel(c.getContext('2d'), gebietId, code, variante, frame, maske);
    bank[code][key] = c;
  }
  return bank[code][key];
}

/* ---------- 7.4 Koordinatensystem (grafisches Lösen, 9.2) ----------
   128×128 Pixel, 1 Einheit = 8 px, Bereich −8 bis 8.
   Modern Retro: Nebenlinien dezent, Hauptachsen deutlich, Geraden mit
   1 px dunklerer Randlinie für gute Lesbarkeit (Schulbetrieb, iPad).
   Je Aufgabenstellung einmal vorgerendert (Offscreen-Canvas). */
const KOSYS_CACHE = new Map();
function kosysMalen(g, gl1, gl2) {
  const F = PALETTE;
  g.fillStyle = F[WEISS]; g.fillRect(0, 0, 128, 128);
  /* Nebenlinien: helles, dezentes Grau */
  g.fillStyle = F[HELLGRAU];
  for (let i = 0; i <= 16; i++) {
    if (i === 8) continue;
    g.fillRect(0, i * 8, 128, 1);
    g.fillRect(i * 8, 0, 1, 128);
  }
  /* Hauptachsen: deutlich */
  g.fillStyle = F[SCHWARZ];
  g.fillRect(0, 64, 128, 1);
  g.fillRect(64, 0, 1, 128);
  /* Achsenbeschriftung alle 4 Einheiten */
  for (let k = -8; k <= 8; k += 4) {
    if (k === 0) continue;
    const zx = 64 + k * 8, zy = 64 - k * 8;
    const t = String(k).replace('-', '−');
    const w = t.length * 8;
    /* Zahl mit weißem Hintergrund, im Bild gehalten, abseits der Achse */
    const tx = Math.max(0, Math.min(128 - w, zx - Math.floor(w / 2)));
    const ty = Math.max(0, Math.min(120, zy - 4));
    g.fillStyle = F[WEISS];
    g.fillRect(tx, 66, w, 8);
    g.fillRect(66, ty, w, 8);
    zeichneText(g, t, tx, 66, GRAU);
    zeichneText(g, t, 66, ty, GRAU);
  }
  /* Geraden: erst 1 px dunkle Randlinie, dann der klare Kern
     (I rot, II blau) – so bleiben sie vor dem Gitter lesbar. */
  const linie = function (gr, farbe, dunkel) {
    if (gr.vertikal) {
      const x = 64 + Math.round(gr.x.zahl() * 8);
      g.fillStyle = F[dunkel]; g.fillRect(x - 1, 0, 3, 128);
      g.fillStyle = F[farbe];  g.fillRect(x, 0, 1, 128);
      return;
    }
    const mz = gr.m.zahl(), bz = gr.b.zahl();
    const kern = [];
    if (Math.abs(mz) <= 1) {
      for (let i = -64; i <= 64; i++) {
        const x = i * 0.125;
        kern.push([64 + Math.round(x * 8), 64 - Math.round((bz + mz * x) * 8)]);
      }
    } else {
      for (let i = -64; i <= 64; i++) {
        const y = i * 0.125;
        kern.push([64 + Math.round(((y - bz) / mz) * 8), 64 - Math.round(y * 8)]);
      }
    }
    g.fillStyle = F[dunkel];
    for (let i = 0; i < kern.length; i++) {
      const x = kern[i][0], y = kern[i][1];
      if (y >= 0 && y < 128) { g.fillRect(x - 1, y, 1, 1); g.fillRect(x + 1, y, 1, 1); }
      if (x >= 0 && x < 128) { g.fillRect(x, y - 1, 1, 1); g.fillRect(x, y + 1, 1, 1); }
    }
    g.fillStyle = F[farbe];
    for (let i = 0; i < kern.length; i++) {
      const x = kern[i][0], y = kern[i][1];
      if (x >= 0 && x < 128 && y >= 0 && y < 128) g.fillRect(x, y, 1, 1);
    }
  };
  linie(geradeAus(gl1), ROT, DUNKELROT);
  linie(geradeAus(gl2), BLAU, DUNKELBLAU);
}
function zeichneKoordinatensystem(g, links, oben, gl1, gl2) {
  const key = glAnzeige(gl1) + ' § ' + glAnzeige(gl2);
  let c = KOSYS_CACHE.get(key);
  if (!c) {
    c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    kosysMalen(c.getContext('2d'), gl1, gl2);
    if (KOSYS_CACHE.size > 16) KOSYS_CACHE.clear();   /* Cache klein halten */
    KOSYS_CACHE.set(key, c);
  }
  g.drawImage(c, links, oben);
}

/* ---------- 7.5 Schatten, Glanz und Partikel (rein optisch) ----------
   Schattenflecken unter den Figuren, wandernde Glanzpunkte auf
   Gegenständen und bis zu 40 Pixel-Partikel: Funken bei Treffern,
   Staub beim Laufen, kleine Herzen beim Aufsammeln, Sternchen beim
   Sieg. Alles wird nur in den Zeichenfunktionen erzeugt und gezeichnet,
   die Spiellogik bleibt unangetastet. */

/* Weicher Schattenfleck unter einer Figur (2 Zeilen, abgerundet). */
function schattenZeichnen(g, xMittig, yBoden, breite) {
  const x = Math.round(xMittig - breite / 2), y = Math.round(yBoden);
  g.fillStyle = 'rgba(26,20,36,0.30)';
  g.fillRect(x, y, breite, 1);
  g.fillRect(x + 2, y + 1, breite - 4, 1);
}

/* Wandernder Glanzpunkt: läuft über die sichtbaren Pixel eines Sprites
   (für Gegenstände). Wird je Sprite einmal berechnet und gecacht. */
const GLANZ_PIXEL = new Map();
function glitzerPixel(spr, frame) {
  let px = GLANZ_PIXEL.get(spr);
  if (px === undefined) {
    const d = spr.getContext('2d').getImageData(0, 0, spr.width, spr.height).data;
    px = [];
    for (let y = 0; y < spr.height; y++) {
      for (let x = 0; x < spr.width; x++) {
        if (d[(y * spr.width + x) * 4 + 3] > 0) px.push([x, y]);
      }
    }
    GLANZ_PIXEL.set(spr, px);
  }
  if (!px.length) return null;
  const i = (frame >> 3) % (px.length * 2);
  return i < px.length ? px[i] : null;
}

/* Partikel: maximal 40 gleichzeitig. art: 'punkt', 'staub', 'herz', 'stern'. */
const PARTIKEL = [];
function partikel(raum, x, y, vx, vy, dauer, farbe, art) {
  if (PARTIKEL.length >= 40) PARTIKEL.shift();
  PARTIKEL.push({
    raum: raum, x: x, y: y, vx: vx, vy: vy,
    leben: dauer, dauer: dauer, farbe: farbe, art: art || 'punkt'
  });
}
function partikelTick() {
  for (let i = PARTIKEL.length - 1; i >= 0; i--) {
    const p = PARTIKEL[i];
    p.x += p.vx; p.y += p.vy;
    if (p.art === 'staub') { p.vy += 0.015; p.vx *= 0.94; }
    else if (p.art === 'stern') { p.vx *= 0.93; p.vy *= 0.93; }
    else if (p.art === 'herz') { p.vx *= 0.97; }
    if (--p.leben <= 0) PARTIKEL.splice(i, 1);
  }
}
function partikelZeichnen(g, raum) {
  for (let i = 0; i < PARTIKEL.length; i++) {
    const p = PARTIKEL[i];
    if (p.raum !== raum) continue;
    /* im letzten Drittel der Lebenszeit dezent blinken */
    if (p.leben < p.dauer / 3 && (p.leben & 1)) continue;
    const x = Math.round(p.x), y = Math.round(p.y);
    g.fillStyle = PALETTE[p.farbe];
    if (p.art === 'herz') {
      g.fillRect(x, y, 1, 1); g.fillRect(x + 2, y, 1, 1);
      g.fillRect(x, y + 1, 3, 1); g.fillRect(x + 1, y + 2, 1, 1);
    } else if (p.art === 'stern') {
      g.fillRect(x + 1, y, 1, 1); g.fillRect(x, y + 1, 1, 1);
      g.fillRect(x + 2, y + 1, 1, 1); g.fillRect(x + 1, y + 2, 1, 1);
    } else {
      g.fillRect(x, y, 1, 1);
    }
  }
}

/* Optische Merker: erkennen Übergänge zwischen zwei gezeichneten
   Frames (Herz aufgesammelt, Monster besiegt, Gegenstand mitgenommen)
   und erzeugen passende Partikel. Kein Einfluss auf die Spiellogik. */
const VISUELL = {
  miraX: 0, miraY: 0,
  letzteHerzen: null, letzteMonster: null, letzteGegenstaende: [],
  kampfModus: '', letzterZustand: ''
};
function weltOptikPruefen(bi) {
  const b = BILDSCHIRME[bi];
  const gi = b.gebietIndex;
  const gb = GEBIETE[gi];
  const z = GEBIET_ZUSTAND[gi];
  const y0 = CONFIG.HUD_HOEHE;
  /* gefallenes Herz aufgesammelt → kleine Herzen steigen auf */
  const herzen = z.herzFallen.filter(function (h) { return h.bildschirm === bi; })
    .map(function (h) { return h.x + '|' + h.y; });
  if (VISUELL.letzteHerzen !== null && herzen.length === VISUELL.letzteHerzen.length - 1) {
    const weg = VISUELL.letzteHerzen.filter(function (k) { return herzen.indexOf(k) < 0; })[0];
    if (weg) {
      const teile = weg.split('|');
      for (let i = 0; i < 4; i++) {
        partikel('welt', (+teile[0]) + 4 + zg(-3, 3), y0 + (+teile[1]) + 4 + zg(-2, 0),
          zg(-2, 2) / 15, -0.3 - Math.random() * 0.25, 24 + zg(0, 10), ROT, 'herz');
      }
    }
  }
  VISUELL.letzteHerzen = herzen;
  /* Monster besiegt → Sternchen an seiner Stelle */
  const monster = z.monster.filter(function (m) { return m.lebt; })
    .map(function (m) { return Math.round(m.x) + '|' + Math.round(m.y); });
  if (VISUELL.letzteMonster !== null && monster.length === VISUELL.letzteMonster.length - 1) {
    const weg = VISUELL.letzteMonster.filter(function (k) { return monster.indexOf(k) < 0; })[0];
    if (weg) {
      const teile = weg.split('|');
      for (let i = 0; i < 8; i++) {
        const w = i / 8 * Math.PI * 2;
        partikel('welt', (+teile[0]) + 8, y0 + (+teile[1]) + 8,
          Math.cos(w) * 0.8, Math.sin(w) * 0.8 - 0.2, 26 + zg(0, 12),
          i % 2 ? GELB : GLANZ, 'stern');
      }
    }
  }
  VISUELL.letzteMonster = monster;
  /* Gegenstand eingesammelt → Glanzfunken an seiner Stelle */
  if (gb.gegenstandName && z.gegenstandDraussen && z.gegenstandMitgenommen
      && !VISUELL.letzteGegenstaende[gi] && gb.gegenstandPos.k === b.karteIndex) {
    const p = gb.gegenstandPos;
    for (let i = 0; i < 8; i++) {
      partikel('welt', p.x * 16 + 8 + zg(-4, 4), y0 + p.y * 16 + 6 + zg(-4, 2),
        zg(-2, 2) / 12, -0.2 - Math.random() * 0.3, 22 + zg(0, 10),
        i % 2 ? GLANZ : GELB, 'stern');
    }
  }
  VISUELL.letzteGegenstaende[gi] = z.gegenstandMitgenommen;
}

/* Dezente Vignette an den Bildschirmrändern: einmal vorgerendert,
   keine Scanlines, keine Bildschirmkrümmung. */
let VIGNETTE_CANVAS = null;
function vignetteZeichnen(g) {

    VIGNETTE_CANVAS.width = CONFIG.BREITE; VIGNETTE_CANVAS.height = CONFIG.HOEHE;
    const vg = VIGNETTE_CANVAS.getContext('2d');
    vg.fillStyle = 'rgba(26,20,36,0.18)';
    vg.fillRect(0, 0, 256, 1); vg.fillRect(0, 239, 256, 1);
    vg.fillRect(0, 0, 1, 240); vg.fillRect(255, 0, 1, 240);
    vg.fillStyle = 'rgba(26,20,36,0.09)';
    vg.fillRect(0, 1, 256, 1); vg.fillRect(0, 238, 256, 1);
    vg.fillRect(1, 0, 1, 240); vg.fillRect(254, 0, 1, 240);
    vg.fillStyle = 'rgba(26,20,36,0.04)';
    vg.fillRect(0, 2, 256, 1); vg.fillRect(0, 237, 256, 1);
    vg.fillRect(2, 0, 1, 240); vg.fillRect(253, 0, 1, 240);
  }
  g.drawImage(VIGNETTE_CANVAS, 0, 0);
}

/* Blockierte Kachelzeichen; 'x' (Zaubertor) zählt dazu, solange
   das Gebiet noch nicht geschafft ist (siehe istBlockiert). */
const BLOCKIERT = { '#': true, 'o': true, '~': true };

function istBlockiert(bildschirmIndex, kx, ky) {
  if (kx < 0 || kx >= CONFIG.FELD_BREITE || ky < 0 || ky >= CONFIG.FELD_HOEHE) return true;
  const b = BILDSCHIRME[bildschirmIndex];
  const code = b.karte[ky][kx];
  if (BLOCKIERT[code]) return true;
  if (code === 'x') {
    /* Zaubertor: blockiert, bis das Gebiet geschafft ist. */
    const zustand = GEBIET_ZUSTAND[b.gebietIndex];
    return zustand ? !zustand.besiegt : true;
  }
  return false;
}

};

/* Kollisionskasten am Fuß der Figur (etwas kleiner als das Sprite). */
function platzFrei(bildschirmIndex, x, y) {
  const bx = x + 3, by = y + 8, breite = 10, hoehe = 7;
  const tx0 = Math.floor(bx / CONFIG.KACHEL),
        tx1 = Math.floor((bx + breite - 1) / CONFIG.KACHEL),
        ty0 = Math.floor(by / CONFIG.KACHEL),
        ty1 = Math.floor((by + hoehe - 1) / CONFIG.KACHEL);
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (istBlockiert(bildschirmIndex, tx, ty)) return false;
    }
  }
  return true;
}

/* Monster eines Gebiets erzeugen. Jedes normale Monster braucht
   genau eine richtige Antwort (Boss: 4 Phasen). Ein Durchlauf hat
   damit 16 Aufgaben (12 Monster + Boss) – ca. 15-25 min. */
function gebietZuruecksetzen(gi) {
  const gb = GEBIETE[gi];
  const z = {
    besiegt: false,
    gegenstandDraussen: false,
    gegenstandMitgenommen: false,
    herzFallen: [],
    monster: [],
    betreten: false      /* Gebiets-Text schon eingeblendet? */
  };
  GEBIET_ZUSTAND[gi] = z;
  gb.monsterSpawns.forEach(function (s) {
    z.monster.push({
      bildschirm: gb.startBildschirm + s.k,
      x: s.x * CONFIG.KACHEL, y: s.y * CONFIG.KACHEL,
      hp: gb.boss ? 4 : 1,
      lebt: true,
      eiszeit: 0,           // Frames Ruhe nach einem Kampf
      timer: 0, dx: 0, dy: 0
    });
  });
}

/* Einfache KI: zufällig laufen oder Mira verfolgen,
   nur Monster auf dem aktuellen Bildschirm bewegen sich. */
function aktualisiereMonster() {
  const bi = SPIELER.bildschirm;
  const gi = BILDSCHIRME[bi].gebietIndex;
  const gb = GEBIETE[gi];
  const z = GEBIET_ZUSTAND[gi];
  for (let i = 0; i < z.monster.length; i++) {
    const m = z.monster[i];
    if (!m.lebt || m.bildschirm !== bi) continue;
    if (m.eiszeit > 0) { m.eiszeit--; continue; }

    let dx = 0, dy = 0, tempo = CONFIG.MONSTER_TEMPO;
    const abstand = Math.abs(SPIELER.x - m.x) + Math.abs(SPIELER.y - m.y);
    if (gb.verhalten === 'jagd' && abstand < 100) {
      dx = SPIELER.x > m.x ? 1 : (SPIELER.x < m.x ? -1 : 0);
      dy = SPIELER.y > m.y ? 1 : (SPIELER.y < m.y ? -1 : 0);
      tempo = CONFIG.JAGD_TEMPO;
    } else {
      m.timer--;
      if (m.timer <= 0) {
        m.timer = 40 + Math.floor(Math.random() * 80);
        if (Math.random() < 0.4) { m.dx = 0; m.dy = 0; }
        else {
          const r = Math.floor(Math.random() * 4);
          m.dx = [1, -1, 0, 0][r];
          m.dy = [0, 0, 1, -1][r];
        }
      }
      dx = m.dx; dy = m.dy;
    }
    if (dx !== 0 && platzFrei(bi, m.x + dx * tempo, m.y)) m.x += dx * tempo;
    if (dy !== 0 && platzFrei(bi, m.x, m.y + dy * tempo)) m.y += dy * tempo;
    /* Monster bleiben in ihrem Bildschirm. */
    m.x = Math.max(16, Math.min(224, m.x));
    m.y = Math.max(16, Math.min(160, m.y));
  }
}

/* ============================================================
   10. Kampf – Kampfbildschirm, Zahlenfeld, Feedback
   ------------------------------------------------------------
   Gleichungssystem oben (I / ∧ II), bei „grafisch" das
   Koordinatensystem mit zwei Geraden, Eingabefelder für x und y,
   die Schaltflächen „keine Lösung" und „unendlich viele" sowie
   das Bildschirm-Zahlenfeld (0-9, Komma, Minus, Bruchstrich /,
   Löschen, OK). Niveau „leicht": Lückenschritte, bis „standard":
   Hinweis-Schaltfläche (9.3). Feedback nach Abschnitt 11 mit
   scrollbarer Lösungsweg-Anzeige. */

let KAMPF = null;
const GEBIET_VERFAHREN = { wiese: 'grafisch', wald: 'gleichsetzen', sumpf: 'einsetzen', hoehle: 'addition' };
const VERFAHREN_KURZ = {
  grafisch: 'grafisch', gleichsetzen: 'Gleichsetzen',
  einsetzen: 'Einsetzen', addition: 'Addition'
};

function starteKampf(m, gi) {
  const gb = GEBIETE[gi];
  KAMPF = {
    monster: m, gebietIndex: gi,
    verfahren: GEBIET_VERFAHREN[gb.id],
    niveau: NIVEAUS[SPIEL.niveauIndex],
    modus: 'aufgabe',    /* 'aufgabe' | 'richtig' | 'weg' | 'wahl' | 'wahlEnde' */
    sfTyp: 'auto',
    aufgabe: null,
    feldAktiv: 'x', eingabeX: '', eingabeY: '',
    meldung: '', meldungDauer: 0,
    hinweisOffen: false, richtigTimer: 0,
    werkzeugBenutzt: {}, werkzeugText: '', fernrohrOffen: false,
    wegZeilen: [], wegScroll: 0, wegSichtbar: 20, fehlerHinweis: '',
    regionen: [],
    bossPhasen: null, bossSf: null, bossPhase: 0,
    wahlAuswahl: 0, wahlRichtig: false, wahlFeedback: ''
  };
  if (gb.boss) {
    /* Boss (Burg): 4 Phasen, je Phase ein anderes Verfahren in
       gemischter Reihenfolge, mindestens ein Sonderfall (9.2).
       Vor jeder algebraischen Aufgabe steht die Verfahrenswahl. */
    const phasen = erzeugeBossPhasen();
    KAMPF.bossPhasen = phasen.verfahren;
    KAMPF.bossSf = phasen.sf;
    KAMPF.bossPhase = 0;
    bossAufgabeErzeugen(true);
  } else {
    neueAufgabe('auto');
  }
  SPIEL.zustand = 'kampf';
}

/* Boss-Phasen: alle vier Verfahren gemischt, ein zufälliger
   Index wird zum Sonderfall (keine oder unendlich viele Lösungen). */
function erzeugeBossPhasen() {
  const verfahren = VERFAHREN_LISTE.slice();
  for (let i = verfahren.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = verfahren[i]; verfahren[i] = verfahren[j]; verfahren[j] = tmp;
  }
  const sfIndex = zg(0, 3);
  const sf = [];
  for (let i = 0; i < 4; i++) {
    sf.push(i === sfIndex ? (Math.random() < 0.5 ? 'keine' : 'unendlich') : 'eindeutig');
  }
  return { verfahren: verfahren, sf: sf };
}

/* Aufgabe einer Bossphase. Die Anzeigeformen werden so gewählt,
   dass die Regel aus Abschnitt 9.2 greift: beide nach derselben
   Variablen aufgelöst → Gleichsetzen; eine aufgelöst → Einsetzen;
   beide in Normalform → Addition. */
function bossAufgabeErzeugen(mitWahl) {
  const v = KAMPF.bossPhasen[KAMPF.bossPhase];
  const sf = KAMPF.bossSf[KAMPF.bossPhase];
  const auf = erzeugeAufgabe(v, KAMPF.niveau, sf);
  const sys = auf.system;
  if (v === 'gleichsetzen') {
    const vari = gleichsetzVariable(sys);
    sys.vari = vari;
    sys.g1.form = { typ: 'aufg', vari: vari, reihenfolge: 'xb' };
    sys.g2.form = { typ: 'aufg', vari: vari, reihenfolge: sf === 'unendlich' ? 'bx' : 'xb' };
  } else if (v === 'einsetzen') {
    sys.g2.form = normalFormZufall();
  } else if (v === 'addition') {
    sys.g1.form = normalFormZufall();
    sys.g2.form = normalFormZufall();
    if (glAnzeige(sys.g1) === glAnzeige(sys.g2)) {
      sys.g2.form = { typ: 'normal', ordnung: sys.g1.form.ordnung === 'xy' ? 'yx' : 'xy' };
    }
  }
  /* Hinweis und Lückenschritt passend zur neuen Darstellung */
  auf.hinweis = hinweisText(v, sys);
  auf.luecke = lueckeText(v, auf);
  KAMPF.verfahren = v;
  KAMPF.sfTyp = sf;
  KAMPF.aufgabe = auf;
  KAMPF.eingabeX = ''; KAMPF.eingabeY = ''; KAMPF.feldAktiv = 'x';
  KAMPF.hinweisOffen = false; KAMPF.wegScroll = 0;
  KAMPF.wahlAuswahl = 0;
  /* Werkzeuge wieder aufladen (Abschnitt 6) */
  KAMPF.werkzeugBenutzt = {}; KAMPF.werkzeugText = ''; KAMPF.fernrohrOffen = false;
  KAMPF.modus = (mitWahl && v !== 'grafisch') ? 'wahl' : 'aufgabe';
  if (KAMPF.modus === 'aufgabe') kampfMeldung('Phase ' + (KAMPF.bossPhase + 1) + ' von 4');
}

/* Neue Aufgabe desselben Typs (Abschnitt 11): gleiches Verfahren
   und gleiche Sonderfall-Kategorie, aber neue Zahlen. Im Bosskampf
   wird die aktuelle Phase neu ausgewürfelt (Wahl entfällt dann). */
function neueAufgabe(sfTyp) {
  if (KAMPF.bossPhasen) { bossAufgabeErzeugen(false); return; }
  KAMPF.sfTyp = sfTyp;
  KAMPF.aufgabe = erzeugeAufgabe(KAMPF.verfahren, KAMPF.niveau, sfTyp);
  KAMPF.eingabeX = ''; KAMPF.eingabeY = ''; KAMPF.feldAktiv = 'x';
  KAMPF.hinweisOffen = false; KAMPF.wegScroll = 0;
  KAMPF.modus = 'aufgabe';
  /* Werkzeuge wieder aufladen (Abschnitt 6) */
  KAMPF.werkzeugBenutzt = {}; KAMPF.werkzeugText = ''; KAMPF.fernrohrOffen = false;
}

/* Verfahrenswahl im Bosskampf (9.2): Auswahl aus drei Verfahren,
   Bonus bei sinnvoller Wahl, aber keine Strafe. */
const WAHL_VERFAHREN = ['gleichsetzen', 'einsetzen', 'addition'];
function wahlTreffen(i) {
  if (KAMPF.modus !== 'wahl') return;
  const richtig = i === WAHL_VERFAHREN.indexOf(KAMPF.verfahren);
  if (SPIEL.statistik) SPIEL.statistik.wahl[richtig ? 0 : 1]++;
  const name = VERFAHREN_KURZ[KAMPF.verfahren];
  KAMPF.wahlRichtig = richtig;
  KAMPF.wahlFeedback = richtig
    ? 'Richtig! ' + name + ' ist hier das geschickteste Verfahren.'
    : 'Das geht auch – aber ' + name + ' ist hier geschickter. Kein Nachteil!';
  KAMPF.modus = 'wahlEnde';
}

function kampfMeldung(t) { KAMPF.meldung = t; KAMPF.meldungDauer = 150; }

function kampfZeichen(z) {
  if (z === '.') z = ',';
  if (z === '-') z = '−';
  const feld = KAMPF.feldAktiv === 'x' ? 'eingabeX' : 'eingabeY';
  if (KAMPF[feld].length >= 8) return;
  KAMPF[feld] += z;
}
function kampfFeldLeeren() { KAMPF[KAMPF.feldAktiv === 'x' ? 'eingabeX' : 'eingabeY'] = ''; }
function kampfFeldWechseln(welches) { KAMPF.feldAktiv = welches; }

function kampfOK() {
  if (KAMPF.modus === 'weg') { wegWeiter(); return; }
  if (KAMPF.modus !== 'aufgabe') return;
  const bx = parseEingabe(KAMPF.eingabeX), by = parseEingabe(KAMPF.eingabeY);
  if (!bx || !by) { kampfMeldung('Gib in beide Felder eine Zahl ein.'); return; }
  kampfAntwort({ typ: 'paar', x: bx, y: by });
}
function kampfAntwort(antwort) {
  if (KAMPF.modus !== 'aufgabe') return;
  KAMPF.fernrohrOffen = false; KAMPF.werkzeugText = '';
  const erg = pruefeAntwort(KAMPF.aufgabe.loesung, antwort);
  /* Statistik für den Endbildschirm (Abschnitt 6) */
  if (SPIEL.statistik) {
    SPIEL.statistik.jeVerfahren[KAMPF.verfahren][erg.richtig ? 0 : 1]++;
    if (KAMPF.aufgabe.sfTyp !== 'eindeutig') {
      SPIEL.statistik.sonderfall[erg.richtig ? 0 : 1]++;
    }
  }
  if (erg.richtig) {
    effekt('treffer');
    KAMPF.modus = 'richtig';
    KAMPF.richtigTimer = 55;
  } else {
    /* Falsch: ein Herz verloren, dann der komplette Lösungsweg (11) */
    SPIELER.herzen--;
    SPIELER.blinkDauer = 120;
    effekt('fehler');
    KAMPF.fehlerHinweis = erg.hinweis;
    KAMPF.wegZeilen = erzeugeWeg(KAMPF.aufgabe.system, KAMPF.verfahren, KAMPF.aufgabe.loesung);
    KAMPF.wegScroll = 0;
    KAMPF.modus = 'weg';
  }
}
function wegScrollUm(dz) {
  const max = Math.max(0, KAMPF.wegZeilen.length - KAMPF.wegSichtbar);
  KAMPF.wegScroll = Math.max(0, Math.min(max, KAMPF.wegScroll + dz));
}
function wegWeiter() {
  if (SPIELER.herzen <= 0) { KAMPF = null; SPIEL.zustand = 'gameover'; return; }
  neueAufgabe(KAMPF.sfTyp);
}

/* Sieg: Monster verliert ein Leben, ggf. Herz fallen lassen,
   Gebiet prüfen (aus Etappe 1). */
function kampfGewonnen() {
  const m = KAMPF.monster, gi = KAMPF.gebietIndex;
  const z = GEBIET_ZUSTAND[gi], gb = GEBIETE[gi];
  m.lebt = false;
  if (Math.random() < 0.3) {
    z.herzFallen.push({
      bildschirm: m.bildschirm,
      x: Math.max(16, Math.min(224, Math.round(m.x))),
      y: Math.max(16, Math.min(160, Math.round(m.y)))
    });
  }
  const nochLebend = z.monster.some(function (x) { return x.lebt; });
  if (!nochLebend) {
    z.besiegt = true;   /* Zaubertor öffnet sich */
    if (gb.boss) {
      /* Abschluss: Boss besiegt – Stoppuhr anhalten (Abschnitt 6) */
      SPIEL.endZeit = Date.now();
      effekt('sieg');
      KAMPF = null; SPIEL.zustand = 'ende'; return;
    }
    nachricht('Der Weg ist frei!');
    if (gb.gegenstandName) z.gegenstandDraussen = true;
  }
  KAMPF = null;
  SPIEL.zustand = 'welt';
  SPIELER.unverwundbar = 100;
  /* Herz-Aufladung: Nach jedem gewonnenen Kampf sind die Herzen
     wieder voll (leicht/standard 3, plus 2). */
  SPIELER.herzen = maxHerzen();
}

function tickKampf() {
  if (KAMPF.meldungDauer > 0) KAMPF.meldungDauer--;
  if (KAMPF.modus === 'richtig') {
    if (--KAMPF.richtigTimer <= 0) {
      const m = KAMPF.monster;
      m.hp--;
      if (m.hp <= 0) kampfGewonnen();
      else if (KAMPF.bossPhasen) {
        /* Nächste Bossphase mit neuer Verfahrenswahl (9.2) */
        KAMPF.bossPhase++;
        bossAufgabeErzeugen(true);
      } else {
        kampfMeldung('Treffer! Noch ' + m.hp + ' Treffer nötig.');
        neueAufgabe(KAMPF.sfTyp);
      }
    }
    ereignisse = [];
    return;
  }
  for (let i = 0; i < ereignisse.length; i++) {
    const e = ereignisse[i];
    if (KAMPF.modus === 'weg') {
      if (e === 'enter') wegWeiter();
      else if (e === 'hoch') wegScrollUm(-2);
      else if (e === 'runter') wegScrollUm(2);
    } else if (KAMPF.modus === 'wahl') {
      if (e === 'enter') wahlTreffen(KAMPF.wahlAuswahl);
      else if (e === 'hoch') KAMPF.wahlAuswahl = (KAMPF.wahlAuswahl + 2) % 3;
      else if (e === 'runter') KAMPF.wahlAuswahl = (KAMPF.wahlAuswahl + 1) % 3;
    } else if (KAMPF.modus === 'wahlEnde') {
      if (e === 'enter') KAMPF.modus = 'aufgabe';
    } else if (KAMPF.modus === 'aufgabe') {
      if (e === 'enter') kampfEnter();
      else if (e === 'hoch') kampfFeldWechseln('x');
      else if (e === 'runter') kampfFeldWechseln('y');
    }
  }
}

/* ---------- Gegenstände als Werkzeuge im Kampf (Abschnitt 6) ----------
   Jedes gefundene Werkzeug ist einmal pro Aufgabe einsetzbar,
   ohne Nachteil. Auf Niveau plus (und im grafischen Kampf) ist
   nur der Bumerang verfügbar: Die Probe ist Kontrolle, keine
   Hilfe. Der Hammer zeigt die Normalform – nur sinnvoll, wenn
   eine Gleichung noch nicht in Normal- oder aufgelöster Form
   steht. */
const WERKZEUG_NAMEN = ['Fernrohr', 'Schwert', 'Bumerang', 'Hammer'];
function werkzeugeVerfuegbar() {
  const besitz = SPIELER.gegenstaende;
  if (KAMPF.niveau === 'plus' || KAMPF.verfahren === 'grafisch') {
    return besitz.indexOf('Bumerang') >= 0 ? ['Bumerang'] : [];
  }
  const liste = [];
  WERKZEUG_NAMEN.forEach(function (name) {
    if (besitz.indexOf(name) < 0) return;
    if (name === 'Hammer' && KAMPF.aufgabe) {
      const sys = KAMPF.aufgabe.system;
      const braucht = sys.g1.form.typ !== 'normal' && sys.g1.form.typ !== 'aufg'
        || sys.g2.form.typ !== 'normal' && sys.g2.form.typ !== 'aufg';
      if (!braucht) return;
    }
    liste.push(name);
  });
  return liste;
}

/* Schwert: der erste Umformungsschritt des Lösungswegs,
   ohne die Lösung zu verraten. Reine Funktion (Selbsttest). */
function schwertText(auf, verfahren) {
  const weg = erzeugeWeg(auf.system, verfahren, auf.loesung);
  for (let i = 0; i < weg.length; i++) {
    const z = weg[i].trim();
    if (!z || z.indexOf('I:') === 0 || z.indexOf('∧ II:') === 0) continue;
    return z;
  }
  return '';
}

/* Bumerang: Probe der eingegebenen Werte in beiden Gleichungen.
   Reine Funktion (Selbsttest). */
function bumerangText(sys, x, y) {
  const probe = function (g, name) {
    const links = bAdd(bMul(g.a, x), bMul(g.b, y));
    return name + ' ' + (bGleich(links, g.c) ? 'stimmt ✓' : 'stimmt nicht');
  };
  /* kurze Zeilen (max. 15 Zeichen), passen auch in den schmalen
     Kasten des grafischen Kampfs */
  return 'Probe:\n' + probe(sys.g1, 'I') + '\n' + probe(sys.g2, 'II');
}

/* Hammer: beide Gleichungen in Normalform. Reine Funktion. */
function hammerText(sys) {
  return 'I: ' + normalformAnzeige(sys.g1) + '\n∧ II: ' + normalformAnzeige(sys.g2);
}

/* Werkzeug benutzen (Abschnitt 6): einmal pro Aufgabe. */
function werkzeugBenutzen(name) {
  if (KAMPF.modus !== 'aufgabe' || KAMPF.werkzeugBenutzt[name]) return;
  if (werkzeugeVerfuegbar().indexOf(name) < 0) return;
  const sys = KAMPF.aufgabe.system;
  if (name === 'Fernrohr') {
    KAMPF.fernrohrOffen = true;
  } else if (name === 'Schwert') {
    KAMPF.werkzeugText = schwertText(KAMPF.aufgabe, KAMPF.verfahren);
  } else if (name === 'Hammer') {
    KAMPF.werkzeugText = hammerText(sys);
  } else if (name === 'Bumerang') {
    const x = parseEingabe(KAMPF.eingabeX), y = parseEingabe(KAMPF.eingabeY);
    if (!x || !y) {
      /* Ohne Werte keine Probe – nicht als benutzt zählen */
      KAMPF.werkzeugText = 'Gib erst x und y ein.';
      return;
    }
    KAMPF.werkzeugText = bumerangText(sys, x, y);
  }
  KAMPF.werkzeugBenutzt[name] = true;
}

/* Werkzeugleiste (algebraischer Kampf): gefundene Gegenstände
   in fester Reihenfolge, benutzte Knöpfe grau ohne Region. */
/* 2×2-Raster mit 124 px breiten Knöpfen, damit auch „Fernrohr“
   und „Bumerang“ (64 px) vollständig hineinpassen. */
function werkzeugLeisteZeichnen(g, y) {
  werkzeugeVerfuegbar().forEach(function (name, i) {
    const x = 4 + (i % 2) * 128, yk = y + Math.floor(i / 2) * 14;
    if (KAMPF.werkzeugBenutzt[name]) {
      panelZeichnen(g, x, yk, 120, 12);
      zeichneText(g, name, x + Math.floor((120 - textBreite(name)) / 2), yk + 2, GRAU);
    } else {
      zeichneKnopf(g, x, yk, 120, 12, name);
      KAMPF.regionen.push({ x: x, y: yk, b: 120, h: 12, aktion: 'werkzeug:' + name });
    }
  });
}
/* Flache Arena (1-fach) unter dem Werkzeug-Raster */
function kampfArenaFlach(g, y0) {
  const gb = GEBIETE[KAMPF.gebietIndex];
  const F = PALETTE;
  g.fillStyle = F[NACHT]; g.fillRect(0, y0, 256, 240 - y0);
  g.fillStyle = F[DUNKELGRAU]; g.fillRect(0, y0, 256, 1);
  g.fillStyle = F[GRAU]; g.fillRect(0, y0 + 1, 256, 1);
  const schweben = (SPIEL.frame >> 4) & 1;
  zeichneSprite(g, MIRA.links[0], 44, y0 + 5 - schweben, true, 1);
  zeichneSprite(g, MONSTER_SPRITES[gb.id], 196, y0 + 5 + schweben, false, 1);
  zeichneTextMitte(g, 'gegen', y0 + 9, GRAU);
}

/* Enter im Kampf: schließt zuerst Fernrohr und Werkzeugtext,
   reicht sonst an OK weiter (Abschnitt 6). */
function kampfEnter() {
  if (KAMPF.fernrohrOffen || KAMPF.werkzeugText) {
    KAMPF.fernrohrOffen = false;
    KAMPF.werkzeugText = '';
    return;
  }
  kampfOK();
}

/* Eingaben: Bildschirm-Zahlenfeld, Knöpfe, Felder (7/9.1). */
function kampfAktion(a) {
  if (a === 'ok') kampfOK();
  else if (a === 'loeschen') kampfFeldLeeren();
  else if (a.indexOf('z:') === 0) kampfZeichen(a.substr(2));
  else if (a === 'feldx') kampfFeldWechseln('x');
  else if (a === 'feldy') kampfFeldWechseln('y');
  else if (a === 'antwortKeine') kampfAntwort({ typ: 'keine' });
  else if (a === 'antwortUnendlich') kampfAntwort({ typ: 'unendlich' });
  else if (a === 'hinweis') KAMPF.hinweisOffen = !KAMPF.hinweisOffen;
  else if (a === 'werkzeugZu') { KAMPF.fernrohrOffen = false; KAMPF.werkzeugText = ''; }
  else if (a.indexOf('werkzeug:') === 0) werkzeugBenutzen(a.substr(9));
  else if (a === 'wahl:0') wahlTreffen(0);
  else if (a === 'wahl:1') wahlTreffen(1);
  else if (a === 'wahl:2') wahlTreffen(2);
  else if (a === 'wahlWeiter') { if (KAMPF.modus === 'wahlEnde') KAMPF.modus = 'aufgabe'; }
  else if (a === 'scrollHoch') wegScrollUm(-2);
  else if (a === 'scrollRunter') wegScrollUm(2);
  else if (a === 'weiter') wegWeiter();
}
function kampfTipp(p) {
  const r = KAMPF.regionen;
  for (let i = 0; i < r.length; i++) {
    if (p.x >= r[i].x && p.x < r[i].x + r[i].b && p.y >= r[i].y && p.y < r[i].y + r[i].h) {
      /* kurzzeitige Druckmarke für den Eindrück-Effekt (rein optisch) */
      KAMPF.druck = { x: r[i].x, y: r[i].y, b: r[i].b, h: r[i].h, frame: SPIEL.frame };
      kampfAktion(r[i].aktion);
      return;
    }
  }
}

/* Physische Tastatur im Kampf (Abschnitt 7): Ziffern, Komma,
   Minus, Bruchstrich, Löschen (Backspace), OK (Enter),
   Pfeiltasten, K = keine Lösung, U = unendlich viele, H = Hinweis,
   M = Ton an/aus, 1/2/3 = Verfahrenswahl im Bosskampf. */
function kampfTastatur(e) {
  const k = e.key;
  if (k === 'm' || k === 'M') { tonUmschalten(); return; }
  if (KAMPF.modus === 'wahl') {
    if (k === '1') { wahlTreffen(0); e.preventDefault(); return; }
    if (k === '2') { wahlTreffen(1); e.preventDefault(); return; }
    if (k === '3') { wahlTreffen(2); e.preventDefault(); return; }
    if (k === 'ArrowUp') { KAMPF.wahlAuswahl = (KAMPF.wahlAuswahl + 2) % 3; e.preventDefault(); return; }
    if (k === 'ArrowDown') { KAMPF.wahlAuswahl = (KAMPF.wahlAuswahl + 1) % 3; e.preventDefault(); return; }
    if (k === 'Enter') { wahlTreffen(KAMPF.wahlAuswahl); e.preventDefault(); return; }
    return;
  }
  if (KAMPF.modus === 'wahlEnde') {
    if (k === 'Enter') { KAMPF.modus = 'aufgabe'; e.preventDefault(); }
    return;
  }
  if (k >= '0' && k <= '9') { kampfZeichen(k); e.preventDefault(); return; }
  if (k === ',' || k === '.') { kampfZeichen(','); e.preventDefault(); return; }
  if (k === '-' || k === '−') { kampfZeichen('−'); e.preventDefault(); return; }
  if (k === '/') { kampfZeichen('/'); e.preventDefault(); return; }
  if (k === 'Backspace') { kampfFeldLeeren(); e.preventDefault(); return; }
  if (k === 'Enter') { kampfEnter(); e.preventDefault(); return; }
  if (k === 'ArrowUp') {
    if (KAMPF.modus === 'weg') wegScrollUm(-2); else kampfFeldWechseln('x');
    e.preventDefault(); return;
  }
  if (k === 'ArrowDown') {
    if (KAMPF.modus === 'weg') wegScrollUm(2); else kampfFeldWechseln('y');
    e.preventDefault(); return;
  }
  if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); return; }
  if (k === 'k' || k === 'K') { kampfAntwort({ typ: 'keine' }); return; }
  if (k === 'u' || k === 'U') { kampfAntwort({ typ: 'unendlich' }); return; }
  if (k === 'h' || k === 'H') { KAMPF.hinweisOffen = !KAMPF.hinweisOffen; return; }
}

/* Panel mit Facetten-Rahmen für den Kampfbildschirm. */
function panelZeichnen(g, x, y, b, h) {
  const F = PALETTE;
  g.fillStyle = F[NACHT]; g.fillRect(x, y, b, h);
  g.fillStyle = F[GRAU];      g.fillRect(x, y, b, 1); g.fillRect(x, y, 1, h);
  g.fillStyle = F[DUNKELGRAU]; g.fillRect(x, y + h - 1, b, 1); g.fillRect(x + b - 1, y, 1, h);
}

/* Knopf mit Facetten-Rahmen (hell oben/links, dunkel unten/rechts)
   und kurzem Eindrück-Effekt nach dem Antippen. */
function zeichneKnopf(g, x, y, b, h, text) {
  const F = PALETTE;
  const dr = KAMPF.druck;
  const gedrueckt = dr && (SPIEL.frame - dr.frame) <= 6
    && dr.x === x && dr.y === y && dr.b === b && dr.h === h;
  g.fillStyle = F[gedrueckt ? NACHT : DUNKELGRAU]; g.fillRect(x, y, b, h);
  if (gedrueckt) {
    g.fillStyle = F[NACHT]; g.fillRect(x, y, b, 1); g.fillRect(x, y, 1, h);
    g.fillStyle = F[GRAU];  g.fillRect(x, y + h - 1, b, 1); g.fillRect(x + b - 1, y, 1, h);
  } else {
    g.fillStyle = F[GRAU];      g.fillRect(x, y, b, 1); g.fillRect(x, y, 1, h);
    g.fillStyle = F[NACHT]; g.fillRect(x, y + h - 1, b, 1); g.fillRect(x + b - 1, y, 1, h);
    g.fillStyle = F[HELLGRAU]; g.fillRect(x + 1, y + 1, b - 2, 1); g.fillRect(x + 1, y + 1, 1, h - 2);
  }
  zeichneText(g, text, x + Math.floor((b - textBreite(text)) / 2),
              y + Math.floor((h - 8) / 2), WEISS);
}

/* Gleichungszeile für den Kampfbildschirm: wird nie umbrochen.
   Jede Gleichung bekommt ihre eigene Zeile. Passt sie nicht in
   die verfügbare Breite, entfallen die Leerzeichen
   (z.B. „∧II:y=−1,5x−6") – so bleiben beide Gleichungen auch im
   längsten möglichen Fall vollständig lesbar. */
function kampfGleichungsZeile(praefix, g, maxZeichen) {
  const anzeige = glAnzeige(g);
  if ((praefix + anzeige).length <= maxZeichen) return praefix + anzeige;
  return praefix.replace(/ /g, '') + anzeige.replace(/ /g, '');
}

/* Kampfarena: Mira links, Monster rechts auf einem Bodenstreifen
   (nur Optik, 2-fach vergrößert, sanftes Schweben). */
function kampfArena(g, y0) {
  const gb = GEBIETE[KAMPF.gebietIndex];
  const F = PALETTE;
  g.fillStyle = F[NACHT]; g.fillRect(0, y0, 256, 240 - y0);
  g.fillStyle = F[DUNKELGRAU]; g.fillRect(0, y0, 256, 1);
  g.fillStyle = F[GRAU]; g.fillRect(0, y0 + 1, 256, 1);
  const schweben = (SPIEL.frame >> 4) & 1;
  schattenZeichnen(g, 52, y0 + 36, 28);
  schattenZeichnen(g, 204, y0 + 36, 28);
  zeichneSprite(g, MIRA.links[0], 36, y0 + 4 - schweben, true, 2);
  zeichneSprite(g, MONSTER_SPRITES[gb.id], 188, y0 + 4 + schweben, false, 2);
  zeichneTextMitte(g, 'gegen', y0 + 16, GRAU);
}
/* Kleine Variante (1-fach) neben dem Zahlenfeld des grafischen Kampfs */
function kampfArenaKlein(g) {
  const gb = GEBIETE[KAMPF.gebietIndex];
  const schweben = (SPIEL.frame >> 4) & 1;
  zeichneSprite(g, MIRA.links[0], 140, 122 - schweben, true, 1);
  zeichneSprite(g, MONSTER_SPRITES[gb.id], 164, 122 + schweben, false, 1);
}

function zeichneKampf() {
  const g = KONTEXT;
  g.fillStyle = PALETTE[SCHWARZ]; g.fillRect(0, 0, 256, 240);
  KAMPF.regionen = [];
  /* Modus-Wechsel erkennen (einmalig Funken beim Treffer) */
  const modusEintritt = VISUELL.kampfModus !== KAMPF.modus;
  VISUELL.kampfModus = KAMPF.modus;
  if (KAMPF.modus === 'weg') { zeichneKampfWeg(g); return; }
  if (KAMPF.modus === 'richtig') {
    zeichneKampfRichtig(g, modusEintritt);
    partikelZeichnen(g, 'kampf');
    return;
  }
  /* Kopfzeile: Monstername links, Herzen rechts */
  zeichneText(g, GEBIETE[KAMPF.gebietIndex].monsterName, 4, 0, WEISS);
  for (let i = 0; i < maxHerzen(); i++) {
    g.drawImage(i < SPIELER.herzen ? HERZ_VOLL : HERZ_LEER, 252 - (maxHerzen() - i) * 9, 0);
  }
  if (KAMPF.modus === 'wahl') { zeichneKampfWahl(g); return; }
  if (KAMPF.modus === 'wahlEnde') { zeichneKampfWahlEnde(g); return; }
  if (KAMPF.verfahren === 'grafisch') zeichneKampfGrafisch(g);
  else zeichneKampfAlgebraisch(g);
  partikelZeichnen(g, 'kampf');
}

/* Verfahrenswahl im Bosskampf (9.2): Frage, drei Schaltflächen */
function zeichneKampfWahl(g) {
  const sys = KAMPF.aufgabe.system;
  panelZeichnen(g, 0, 9, 256, 36);
  zeichneText(g, 'Phase ' + (KAMPF.bossPhase + 1) + ' von 4', 4, 12, GELB);
  zeichneText(g, kampfGleichungsZeile('I: ', sys.g1, 31), 4, 22, WEISS);
  zeichneText(g, kampfGleichungsZeile('∧ II: ', sys.g2, 31), 4, 32, WEISS);
  zeichneTextMitte(g, 'Welches Verfahren ist am', 52, HELLGRAU);
  zeichneTextMitte(g, 'geschicktesten?', 62, HELLGRAU);
  for (let i = 0; i < 3; i++) {
    const y = 76 + i * 16;
    zeichneKnopf(g, 64, y, 128, 14, VERFAHREN_KURZ[WAHL_VERFAHREN[i]]);
    if (i === KAMPF.wahlAuswahl) zeichneText(g, '>', 52, y + 3, GELB);
    KAMPF.regionen.push({ x: 64, y: y, b: 128, h: 14, aktion: 'wahl:' + i });
  }
  zeichneTextMitte(g, '(Taste 1, 2, 3 oder antippen)', 132, HELLGRAU);
  kampfArena(g, 202);
}

/* Rückmeldung auf die Verfahrenswahl: Bonus (Tipp) bei
   sinnvoller Wahl, keine Strafe sonst (9.2) */
function zeichneKampfWahlEnde(g) {
  const sys = KAMPF.aufgabe.system;
  panelZeichnen(g, 0, 9, 256, 25);
  zeichneText(g, kampfGleichungsZeile('I: ', sys.g1, 31), 4, 12, WEISS);
  zeichneText(g, kampfGleichungsZeile('∧ II: ', sys.g2, 31), 4, 22, WEISS);
  const farbe = KAMPF.wahlRichtig ? HELLGRUEN : HELLROT;
  let y = 38;
  textUmbruch(KAMPF.wahlFeedback, 30).forEach(function (z) {
    zeichneText(g, z, 4, y, farbe); y += 8;
  });
  if (KAMPF.wahlRichtig && KAMPF.niveau !== 'plus') {
    /* Bonus: der Verfahrens-Tipp (bei plus ohne Hilfe) */
    y += 2;
    textUmbruch(KAMPF.aufgabe.hinweis, 30).forEach(function (z) {

/* ============================================================
   11. Audio – Soundeffekte und Melodien (Web Audio API)
   ------------------------------------------------------------
   Eigene kurze Klänge: Schritte (leise), Treffer, Fehler,
   Gegenstand gefunden, Sieg – dazu eigene Melodien für Titel
   und Burg. Der Audio-Kontext startet erst nach der ersten
   Nutzereingabe (Abschnitt 3). Ton aus/ein mit der M-Taste
   oder per Tipp auf das Symbol im HUD. */

const AUDIO = { ctx: null, master: null, an: true, stueck: null, timer: null };

/* Erst nach der ersten Eingabe starten (Autoplay-Sperre) */
function audioStart() {
  if (!AUDIO.ctx) {
    try {
      const Ktx = window.AudioContext || window.webkitAudioContext;
      if (Ktx) {
        AUDIO.ctx = new Ktx();
        AUDIO.master = AUDIO.ctx.createGain();
        AUDIO.master.gain.value = AUDIO.an ? 1 : 0;
        AUDIO.master.connect(AUDIO.ctx.destination);
      }
    } catch (fehler) { AUDIO.ctx = null; }
  }
  if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
}

/* Ein kurzer Ton: Frequenz, Dauer, Wellenform, Lautstärke, Verzögerung */
function ton(freq, dauer, form, vol, verz) {
  const ctx = AUDIO.ctx;
  if (!ctx || !AUDIO.master) return;
  const t = ctx.currentTime + (verz || 0);
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = form || 'square';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dauer);
  osc.connect(g);
  g.connect(AUDIO.master);
  osc.start(t);
  osc.stop(t + dauer);
}

function effekt(name) {
  if (!AUDIO.ctx) return;
  if (name === 'schritt') {
    ton(110, 0.035, 'triangle', 0.02);
  } else if (name === 'treffer') {
    ton(660, 0.09, 'square', 0.05);
    ton(880, 0.12, 'square', 0.05, 0.08);
  } else if (name === 'fehler') {
    ton(220, 0.16, 'sawtooth', 0.05);
    ton(160, 0.24, 'sawtooth', 0.05, 0.12);
  } else if (name === 'gegenstand') {
    ton(523, 0.1, 'square', 0.05);
    ton(659, 0.1, 'square', 0.05, 0.1);
    ton(784, 0.16, 'square', 0.05, 0.2);
  } else if (name === 'sieg') {
    ton(523, 0.12, 'square', 0.05);
    ton(659, 0.12, 'square', 0.05, 0.12);
    ton(784, 0.12, 'square', 0.05, 0.24);
    ton(1046, 0.3, 'square', 0.05, 0.36);
  }
}

/* Eigene kurze Melodien: [Frequenz, Schläge], 0 = Pause */
const MUSIK_TAKT = 0.16;
const MUSIK = {
  titel: [
    [523, 1], [659, 1], [784, 1], [659, 1], [880, 1], [784, 1], [659, 1], [0, 1],
    [587, 1], [698, 1], [880, 1], [698, 1], [784, 2], [0, 2]
  ],
  burg: [
    [440, 1], [523, 1], [440, 1], [349, 1], [392, 1], [330, 1], [349, 1], [0, 1],
    [440, 1], [349, 1], [330, 1], [294, 2], [0, 2]
  ]
};

/* Hintergrundmusik starten/stoppen (wird je Zustand gewünscht) */
function musikSetzen(name) {
  if (AUDIO.stueck === name) return;
  AUDIO.stueck = name;
  if (AUDIO.timer) { clearTimeout(AUDIO.timer); AUDIO.timer = null; }
  if (!name) return;
  const spiele = function () {
    if (AUDIO.stueck !== name) return;
    const melodie = MUSIK[name];
    let t = 0;
    for (let i = 0; i < melodie.length; i++) {
      if (melodie[i][0] > 0) {
        ton(melodie[i][0], melodie[i][1] * MUSIK_TAKT * 0.85,
          name === 'burg' ? 'triangle' : 'square', 0.03, t);
      }
      t += melodie[i][1] * MUSIK_TAKT;
    }
    if (typeof setTimeout === 'function') {
      AUDIO.timer = setTimeout(spiele, t * 1000);
    }
  };
  spiele();
}
function musikAktualisieren() {
  let wunsch = null;
  if (SPIEL.zustand === 'titel') wunsch = 'titel';
  else if (SPIEL.zustand === 'welt' && BILDSCHIRME[SPIELER.bildschirm].gebietIndex === 4) wunsch = 'burg';
  else if (SPIEL.zustand === 'kampf' && KAMPF && GEBIETE[KAMPF.gebietIndex].boss) wunsch = 'burg';
  if (wunsch !== AUDIO.stueck) musikSetzen(wunsch);
}

/* Ton an/aus: M-Taste oder Tipp auf das HUD-Symbol */
function tonUmschalten() {
  AUDIO.an = !AUDIO.an;
  if (AUDIO.master) AUDIO.master.gain.value = AUDIO.an ? 1 : 0;
  nachricht(AUDIO.an ? 'Ton an.' : 'Ton aus.');
}
